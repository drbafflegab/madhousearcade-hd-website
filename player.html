<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>player</title>
<style>
  /* ABC Areal, self-hosted as one variable WOFF2 - the same face, the same
     file and the same licence as the menu in `madhousearcade`, whose
     `products/website/source/index.html.in` carries the whole argument for
     all three. It is repeated rather than shared because `madhousearcade`'s
     site had no stylesheet on purpose; its `cmake/Website.cmake` says why.

     `areal.woff2` unrooted: the player is copied in beside it at the site
     root, and the preview serves that root from a directory rather than from
     a host of its own. */
  @font-face {
      font-family: "ABC Areal";
      src: url("areal.woff2") format("woff2");
      font-weight: 400 700;
      font-style: oblique 0deg 12deg;
      font-display: swap;
  }

  /* Every colour on this page is one of these, and the page rewrites them from
     the game's own background once the module is read - see `applyTheme` below.
     The values here are the fallback and nothing more: they are what a reader
     sees before a module has been loaded, and what stays on screen when the
     load is refused. They are the dark chrome this page had before a game could
     choose, so a refusal still looks like the player rather than like nothing.

     Named for their role rather than their colour, because after the first
     frame they are whatever the game said. */
  :root {
      color-scheme: dark;
      --surround: #0b0b12;
      --ink: #c8c8d4;
      --dim: #6a6a80;
      --panel: #1a1a24;
      --hover: #23232e;
      --edge: #2e2e3c;
      --alarm: #e06c6c;
  }
  * { box-sizing: border-box; }
  /* `safe` is what makes zooming IN work. Centred flex content that outgrows
     its container overflows equally in both directions, so the top and left of
     an oversized canvas end up off-screen with no scroll that reaches them -
     and zooming in past the window is now an ordinary thing to do, because a
     zoom no longer refits. `safe` centres while there is room and aligns to the
     start once there is not. The plain `center` above it is the fallback: a
     browser that does not know the keyword drops the whole declaration, so it
     has to be given one it does know first. */
  /* `overscroll-behavior` stops the rubber band, which on a touch device reads
     as the whole page sliding a centimetre under a gesture meant for the game.
     It stops the BOUNCE rather than scrolling itself, which matters: zooming in
     can legitimately make the canvas taller than the window, and the page has
     to stay scrollable to reach it. `overflow: hidden` would have fixed the
     bounce and taken that with it. */
  html, body { overscroll-behavior: none; }
  /* iOS answers a long press on anything it thinks is content by selecting it
     and raising the copy callout. That is a nuisance on any game and an
     outright conflict on one whose OWN long press is a move:
     `madhousearcade`'s `games/minesweeper` marks a mine by holding half a
     second on a cell, so the browser's gesture and the game's fire on the
     same finger. The callout wins, and the mark never happens.

     ON THE WHOLE PAGE rather than the canvas, where these used to be, because
     the canvas was not enough. A phone held upright leaves a band of page above
     and below a square game, and a thumb reaching for the bottom row lands in
     it. Measured in `madhousearcade` rather than here, on iOS 26.5 in the
     simulator, an iPhone 17 at that tree's `games/minesweeper`: a long press on
     the canvas raised nothing, and the same press on the page below it raised
     the magnifier while it was held and a "Copy | Translate | Copy Link with
     Highlight" menu on its release, over a selection of nothing at all. With
     these two on the root, neither.

     Two properties, because they are two behaviours: the callout is the menu,
     and `user-select` is the selection under it, which is what raises the
     magnifier. Declared on the root, both reach the canvas and everything else
     on the page: the callout is inherited, and an element left at `auto` under
     one at `none` is `none` itself.

     Except the row under the canvas, which takes its text back: a refusal is
     written there, and a sentence saying why the page will not play is one a
     player should be able to copy into a bug report. */
  html {
      -webkit-touch-callout: none;
      -webkit-user-select: none; user-select: none;
  }
  #hud { -webkit-user-select: text; user-select: text; }
  /* `dvh` is why this page used to scroll a little on a phone with nothing to
     scroll to. On iOS `vh` is the LARGE viewport - the one measured with the
     browser's toolbars collapsed - so a body sized in it stands taller than the
     window by the toolbar's height for as long as the toolbar is showing, and
     the page offers exactly that much slack. `dvh` follows the viewport that is
     actually there.

     The `vh` line stays underneath it for anything that does not know the unit,
     which then gets the old behaviour rather than no height at all. */

  /* NO PADDING, which is a measurement rather than a taste. The canvas is a
     whole multiple of 240 device pixels, so every pixel the page keeps for
     itself is spent in steps of a whole scale - and a 20px surround is exactly
     what stood between several real devices and a step larger game. Their own
     viewports, run through `canvasScale`: an iPhone SE drew at 2 with the
     padding and draws at 3 without, a 15 Pro Max at 4 and now 5, an iPad mini
     at 5 and now 6, each of them decided by the width rather than the height,
     so a toolbar cannot change the reading. Where it buys no step it costs
     nothing either: the leftover of a whole multiple is centred slack, and the
     total space around the game is the same however it is divided.

     The page measures this rather than knowing it - `available` below reads
     the computed padding, so this line is the only place the number lives, and
     a surround put back here is one the fit will see.

     The chrome keeps a margin of its own, on the row instead of on the page:
     `#hud` carries the horizontal padding now, so a legend on a narrow phone
     still stands off the edge while the canvas above it no longer has to. */
  body {
      margin: 0;
      min-height: 100vh; min-height: 100dvh;
      background: var(--surround); color: var(--ink);
      font: 13px/1.5 "ABC Areal", Arial, Helvetica, sans-serif;
      font-variation-settings: "DRKM" 1;
      display: flex; flex-direction: column; gap: 14px; padding: 0;
      align-items: center; justify-content: center;
      align-items: safe center; justify-content: safe center;
  }
  /* `touch-action: none` is not decoration: without it the first drag across
     the canvas scrolls the page instead of playing the game, and on a phone
     that is every gesture a pointer game is made of. It is not the whole of
     that story either: iOS zooms the page on a double tap over the screen in
     spite of this declaration, and the script below refuses that gesture where
     the declaration is ignored.

     No border and no radius, and what that gives up is worth stating. The
     page's background is the game's own `background` entry, so on a game
     pointing it at the colour it fills its screen with - four of six in
     `madhousearcade` - nothing at all says where the console ends, and the
     screen runs into the page. For those that is the effect rather than the
     cost: `games/asteroids` there has space on both sides of that line. A game
     wanting the console to read as an object declares a surround its screen
     does not use, as `madhousearcade`'s `games/pong` and `games/suika` do.

     And no background, which is a measurement rather than a taste. It was
     `#000`, and wherever the box's edge fell between device pixels the browser
     painted that black and the picture over it to two slightly different
     rects, so a hairline of it showed along one edge or two: a line up to half
     black, at some widths and some zooms and not others. Headless Chrome 153,
     `madhousearcade`'s `games/asteroids` in a 1001x601 window, at 1x, 1.5x and
     2x, with the row below showing, and after a 110% and a 125% zoom: every one
     drew the line and every one was clean with the declaration gone. Without it
     an edge the grid cannot hold blends the game with the page instead, which
     is invisible where they are one colour and an ordinary edge where they are
     not. What it costs is the moment before the first picture, which shows the
     surround rather than a black square. */
  /* No `image-rendering` either: the drawing buffer is the box's own device
     pixels, which `fitCanvas` sizes, so there is no upscale for it to choose a
     filter for. A texel is not a frame pixel, and the frame is drawn at the
     display's resolution rather than enlarged to it. */
  #screen {
      display: block; touch-action: none;

      /* The grey flash iOS paints on anything it thinks was tapped, which
         cannot mean anything over a framebuffer. The callout and the selection
         that used to be refused beside it are refused on the whole page now,
         and the rule on `html` above says why the canvas was not enough. */
      -webkit-tap-highlight-color: transparent;
  }
  #hud { display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
         justify-content: center; min-height: 20px; padding: 0 12px; }
  /* Said again here because the rule above would otherwise silently beat it: an
     author `display: flex` outranks the UA stylesheet's `[hidden] { display:
     none }` whatever the specificity, so without this line the attribute the
     page sets on the row does nothing at all. */
  #hud[hidden] { display: none; }
  /* The legends are written by the script rather than by this file, so they
     need a container to be written into - and a container would be one flex
     item holding two legends where the row wants two items with the row's own
     gap between them. `display: contents` drops the box and leaves the children
     to the row, which is what makes a derived legend sit exactly where a
     literal one used to. */
  #legends { display: contents; }
  kbd { background: var(--panel); border: 1px solid var(--edge);
        border-radius: 3px; padding: 1px 5px; color: var(--dim); }
  button { background: var(--panel); color: var(--ink);
           border: 1px solid var(--edge);
           border-radius: 3px; padding: 4px 10px; cursor: pointer;
           font: inherit; }
  button:hover { background: var(--hover); border-color: var(--edge); }
  .dim { color: var(--dim); }
</style>
</head>
<body>

<canvas id="screen" width="240" height="240"></canvas>

<!-- The only thing under the canvas, and it starts hidden - in the markup
     rather than from the script, so the page never paints it and then takes it
     away. `I` toggles it; `showChrome` below says what that costs the canvas
     and why a refusal overrides it.

     Controls and legends, and nothing read out of the running game EXCEPT what
     it says it reads: every reading this page used to carry is gone, the last
     of them a steps-per-second gauge that the accumulator pinned at 60 whenever
     the machine was keeping up. The legends are `kbd` rather than buttons
     because they name the CONSOLE's buttons, which the page cannot press;
     everything after them is the page's own and each carries its key in its
     label, so there is one place to learn a shortcut rather than a legend
     beside a control that already said it.

     `legends` is empty here and filled by `fillLegends` from the module's own
     `Game_Controls`, so a game is advertised the input it actually reads and
     nothing else. Empty rather than seeded with the pad's two: the page does
     not know what the game reads until it has read the module, and a legend
     painted and then taken away is worse than one that arrives with the game.
     A refusal never fills it, and that is right - a page that will not play has
     no controls to name. -->

<div id="hud" hidden>
  <span id="legends"></span>
  <button id="pause">Pause (Enter)</button>
  <button id="hide">Hide Information (I)</button>
  <button id="mark">Mark frame (M)</button>
  <button id="reset">Reset (R)</button>
  <button id="full">Fullscreen (F)</button>
</div>

<!-- The player's browser-free half, and everything below this line is the
     browser's: the canvas ELEMENT and its box, the GL context, the audio
     context, the listeners and the store. The list a picture is drawn from is
     made two threads away, in `render.worker.js`, and drawn here by
     `present.js`, the WebGL2 presenter. Both loaded as classic scripts so that
     their declarations are in scope for the inline one that follows.

     `products/web-player/source/player.js` says why the split is where it is
     and what runs the far side of it without a browser. -->

<script src="player.js"></script>
<script src="present.js"></script>

<script>
"use strict";

// Where a refusal is SHOWN is the page's, so the page installs it; the console
// line and the throw are `player.js`'s, because neither is the browser's.
//
// The HUD is looked up on each refusal rather than captured here, because a
// refusal can happen while the module is being read, which is before the const
// below exists.

// A named function rather than the arrow it used to be, because a refusal is no
// longer the only thing with a sentence to put here. The watchdog below has one
// too and it must not throw - a run that has already stopped needs no exception
// unwinding a callback - so the two share the banner and differ in what happens
// after it.

function showAlarm (reason) {
    const banner = document.getElementById ("hud");

    if (! banner) { return; }

    // Revealed, because the HUD starts hidden and a banner nobody can see is
    // the same as no banner: a page that refused would otherwise be a blank
    // canvas and nothing else. The attribute is set here rather than through
    // `showChrome`, for the same reason the element is looked up here rather
    // than captured above - a refusal can arrive while the module is being
    // read, which is before `canvas` and `scaleLabel` exist, and `showChrome`
    // reaches both through `fitCanvas`. That would replace the message with a
    // ReferenceError from inside the handler meant to deliver it.
    banner.hidden = false;

    banner.textContent = "player: " + reason;
    banner.style.color = "var(--alarm)";
}

onRefusal (showAlarm);

// ---------------------------------------------------------------------------
// Which game this is.
//
// `player.html?module=<url>`, and `&resources=<directory>` beside it when the
// bytes are not the ones built beside that module. The player knows nothing
// about where games live: it plays whatever module URL it is handed, exactly as
// `inspector` opens whatever module path it is given, so one published page
// plays every game in the tree and every game outside it.
//
// The module URL is resolved against the PAGE, and everything the module needs
// is then resolved against the MODULE - see `resourceBase` in `player.js`.
// Those are two different directories whenever the page is not sitting beside
// the game, which is the normal case now that there is one page rather than a
// copy per game.
//
// `resources=` is the exception and is resolved against the PAGE too, because
// it is the caller's answer rather than the module's: `resourceBase` in
// `player.js` holds that rule, the site-relative resolution it needs to survive
// being served from a subdirectory, and the five values it refuses.
//
// `module` and `resources` are the whole of what this page KEEPS about which
// run this is, and `scrub` below is the one key it keeps about how it looks.
// EVERY OTHER KEY IS THE GAME'S and is passed through as a `Game_Pair`:
// nothing on a module says a word about arguments in advance, so there is no
// declaration to match a key against and a key this game has never heard of is
// not an error - it is a key for a harness, for a menu, or for the next version
// of the game, and the run starts regardless. That is why the three are listed
// rather than left to be inferred from what happens to be read here.
//
// `seed` is this host's own term and is NOT one of them: it rides the query as
// an ordinary pair and the rulebook takes it back out below, so one grammar
// carries it from an address bar and a command line alike.
// ---------------------------------------------------------------------------

const query = new URLSearchParams (location.search);

const moduleUrl = query.get ("module");

if (! moduleUrl) {
    refuse ("no module. Open this page as player.html?module=<url>, where "
        + "<url> names a game's <name>.wasm, relative to this page or "
        + "absolute. Add &resources=<directory> to play it against bytes "
        + "that are not the ones beside it.");
}

// Resolved once, here, so that a URL this page cannot make sense of is a
// refusal naming it rather than a TypeError from whichever line reached for it
// first.
const moduleBase = resolve (moduleUrl);

function resolve (url) {
    try {
        return new URL (url, location.href);
    } catch {
        refuse (`module=${url} is not a URL this page can resolve against `
            + `${location.href}.`);
    }
}

// Resolved here rather than at every `reset`, for the reason above and one
// more: a bad value should refuse the page once, before a module is fetched,
// rather than on whichever reset happened to be the first to want a file.
const resourceDirectory = resourceBase (moduleBase, location.href,
    query.get ("resources"));

// ---------------------------------------------------------------------------
// Which run this is, and the address that says so.
//
// Decided once, here, rather than at every `reset`. A roll per reset would make
// R a different game each time, which is not what resetting a game means, and
// would leave the address bar describing only the first run the page played.
//
// `composeRun` is handed all three of the things this page can reach that
// `player.js` may not - `Math.random`, the clock, and the browser's own
// `history` - and it composes what the query did not carry: a seed where none
// was named, a day where none was named, MERGED into what was there and written
// back through `replaceState`, which rewrites the address with no navigation
// and no history entry. It is a relative reference, so nothing here needs to
// know where the site is mounted. A bare link is therefore a fresh game, and
// the moment it loads the address bar holds the run that is on screen.
//
// THE RUN IS READ OUT OF THE QUERY THAT COMPOSER ANSWERED, which is the one
// ordering decision here and is what keeps a page from playing one run while
// displaying another. So `runQuery` rather than `location.search` is what
// `start` below reads the seed and the pairs out of - and a recording written
// later carries the number that was rolled by construction rather than by a
// rule somebody has to remember.
// ---------------------------------------------------------------------------

const runQuery = composeRun (location.search, Math.random, new Date (),
    history);

// ---------------------------------------------------------------------------
// What this browser remembers about this game.
//
// `localStorage`, keyed by the module's own declared name - `SaveStore` in
// `player.js` holds the key, the one spelling a blob has and the ladder that
// discards every defect to zeros. What is here is only the browser's half of
// it, because reaching for `localStorage` at all is what a browser can refuse.
//
// It THROWS rather than answering nothing where storage is disabled, or where
// a page is embedded under a policy that partitions it - so the property access
// is inside the guard rather than beside it, and a page that cannot have a
// store plays and forgets instead of refusing to start. That is the same
// judgement the discard ladder is written around: nobody would be told, and a
// lost score is smaller than a blank canvas.
// ---------------------------------------------------------------------------

const saveStore = (() => {
    try { return new SaveStore (localStorage); }
    catch { return null; }
}) ();

// The seed and the rest of what this run was told, decided in `start` rather
// than here.
//
// `runSeed` is a number by the time anything reads it: `queryArguments` answers
// `null` for a query that named no seed, and `runQuery` above cannot be one -
// the composer wrote a number into it wherever the address had none.
//
// Every key that is not one of this page's own becomes a pair, held to the
// format a recording and a session need and to nothing else - and nothing about
// that waits for the GAME, because there is nothing on a module to wait for. It
// waits for the RULEBOOK: the charset, the two lengths, the reserved key, the
// duplicate and the sort are `products/host-core`'s, and this page fetches that
// module beside the trampoline. So the split is by which round trip rather than
// by which question, and the seed and the pairs a run was told are still
// decided once, out of the query the composer above answered, for the whole
// life of the page.
let runSeed = 0;
let runArguments = null;

// ---------------------------------------------------------------------------
// The presentation probe, which is off unless the address says otherwise.
//
// `?probe=present` is a person at this machine asking one question: does a frame
// this page committed reach the screen? `docs/presentation-probe.md` is the
// whole reading, `products/web-player/source/probe.js` is the whole of the code
// that takes it - the screen capture, the locator, the decoder and the report -
// and this page fetches that file at the bottom of this script and only there.
//
// A SEPARATE FILE RATHER THAN A BRANCH IN HERE, because an ordinary load must
// not even parse it: what is in it is a screen capture, and a page somebody is
// playing a game on should carry none. The PREVIEW is the only assembly that
// holds it; in `madhousearcade`, `cmake/Website.cmake` copied it there alone
// and `site_holds_no_presentation_probe` refused a deployable that had it.
//
// Two fields stay here, because the run is opened here and nothing else may
// compose either. `probing` is what asks the renderer to stamp each frame's
// number into the picture, and `replayText` is the recording the simulation
// plays instead of the mouse - fetched beside the module below, and read out of
// the query only for a page that is probing, because a driver that answers the
// page's halts as if nothing happened is right for a probe and wrong for a
// player.
// ---------------------------------------------------------------------------

const probing = query.get ("probe") === "present";

const replayUrl = probing ? query.get ("replay") : null;

let replayText = null;

// ---------------------------------------------------------------------------
// A run started from a recording, which is off unless the address says
// otherwise.
//
// `?resume=message` opens no run until a page of this site hands it one: the
// page posts `{ kind: "arcade-resume-ready" }` to its parent and waits for
// `{ kind: "arcade-resume", text }`, and the recording in `text` is replayed
// on the simulation's thread up to its `frame` line, undrawn and unheard, and
// then played on by the hand - `sim.worker.js`'s `forward` is what that means.
// It is what a tuner's snapshot is restored through, and one message carries
// a snapshot taken in the tuner and a `.replay` file loaded into it alike.
//
// `resumeText` is the recording, kept for `R`, which starts the same moment
// again; a second `arcade-resume` replaces it and resets onto it.
// `forwarding` is true from a reset to the hand-over, while there is no run
// the hand can record yet.
//
// A RESUMED RUN WRITES NO SAVE. The store is the player's progress in the real
// game, and a run rebuilt from a recording is a developer's run replayed, so
// every blob the simulation posts is dropped rather than kept - before the
// hand-over and after it.
// ---------------------------------------------------------------------------

const resuming = query.get ("resume") === "message";

let resumeText = null;
let resumeArrived = null;
let forwarding = false;

// The hash of the newest description the simulation posted, which is what the
// recording this page answers a request with names as the picture it ends on.
let runHash = null;

// ---------------------------------------------------------------------------
// The scrub bar, which is off unless the address says otherwise.
//
// `?scrub=on` makes the pause a place to look back from: the simulation keeps
// the last thirty seconds of what every step captured, and while the run is
// paused the page moves a cursor over that ring - the arrows step a frame each
// way, a held arrow plays at sixty frames a second with the sound forward or
// backward, and `Shift` goes a second a tap and eight frames a frame held,
// silently. The ring, the cursor and the four messages are `sim.worker.js`'s,
// under its `scrub` case; nothing here steps the game, queues a press or grows
// the record, so a run scrubbed and a run not scrubbed mark the same file.
//
// SPLIT THE WAY THE PROBE IS. The keyboard and the pacing are here, beside the
// handlers they guard, because they decide what a key MEANS and a key must not
// wait on a fetch to stop meaning something to the game. The bar itself - its
// style, its track, the pointer that drags along it and the label that names
// a new tempo - is `scrub.js`, fetched at the bottom of this script and only
// under the key, so an ordinary load neither fetches nor parses any of it;
// the hooks below ask whether its functions are there yet rather than
// assuming.
// ---------------------------------------------------------------------------

const scrubbing = query.get ("scrub") === "on";

// The newest answer the simulation gave about the cursor - `frame`, `floor`,
// `head` and `stale` - or null while the bar is shut.
let scrubAt = null;

// The arrow being held, the timer that turns a tap into a run 500 ms on, and
// the run itself once it has started: which way, how many frames a due frame
// is worth, whether it sounds, the animation-frame instant it started at and
// how many due frames it has posted.
let scrubKey = null;
let scrubTimer = null;
let scrubRun = null;

// How slowly the live game is being played: 1, 2 or 4 console frames a step.
// `S` cycles it under `scrub=on`, whether or not the bar is open, and it
// outlives a pause, a resume and `R` alike - a person slowing a run down to
// see it go wrong again wants the next run slow too. The simulation's `tempo`
// case is the clock's half and the speaker's, and the label that names the
// new speed for a moment after each press is `scrub.js`'s.
let scrubTempo = 1;

const SCRUB_HOLD_MS = 500;
const SCRUB_SHIFT_TAP = 60;
const SCRUB_SHIFT_RATE = 8;

// The bar opens with the pause. Posted AFTER the pause's own shed, so on a game
// that reads a pointer the step that sends it away is in the ring before the
// cursor is put at the head: messages to one worker arrive in the order sent.
function scrubBegin () {
    post ({ kind: "scrub", begin: true });
}

// And closes with the resume, BEFORE the prime: the head's picture goes back up
// with the live rows, and the next tick steps from there.
function scrubEnd () {
    scrubRelease ();

    scrubAt = null;

    post ({ kind: "scrub", end: true });

    if (typeof scrubHide === "function") { scrubHide (); }
}

// The next tempo round the cycle, posted to the run that is playing.
function scrubSlow () {
    scrubTempo = scrubTempo === 1 ? 2 : scrubTempo === 2 ? 4 : 1;

    post ({ kind: "tempo", divisor: scrubTempo });

    // And the tempo said for a moment, over the picture, which is `scrub.js`'s.
    if (typeof scrubTempoShown === "function") { scrubTempoShown (scrubTempo); }
}

// One move of the cursor, sounded or not. The simulation clamps it to what the
// ring holds and answers with where it landed.
function scrubMove (frames, sound) {
    post ({ kind: "scrub", move: frames, sound });
}

// A held arrow becoming a run, 500 ms after it went down. The first animation
// frame after this is the run's zero, so the first frame it owes is one
// display frame on rather than one sixtieth of a second early.
//
// THE SOUND IS RESUMED HERE and put away when the run ends, because the pause
// put it away and a tap must stay silent. That is outside the key's handler,
// half a second after the gesture, and what it resumes is the fresh context
// the put-away built, which has never run. The hand readings in both browsers
// were of a context the page had suspended after it ran, so they do not say
// this is allowed - and a browser that refuses it scrubs in silence, because
// the unlock `start` installs stands aside while the bar is open.
function scrubHold (direction, shift) {
    scrubTimer = null;

    scrubRun = { direction, rate: shift ? SCRUB_SHIFT_RATE : 1,
        sound: ! shift, started: null, sent: 0 };

    if (scrubRun.sound && synth) { cancelAudioRest (); synth.resume (); }
}

// The arrow let go, or the bar shut under it: no timer, no run, and the sound
// put back where the pause left it.
function scrubRelease () {
    if (scrubTimer !== null) { clearTimeout (scrubTimer); }

    scrubTimer = null;
    scrubKey = null;

    if (scrubRun && scrubRun.sound && synth && halt.paused) {
        replaceSpeaker ();
    }

    scrubRun = null;
}

// A key while the bar is open: true where it was the bar's to take. An arrow
// moves the cursor at once - a tap is one frame, or a second with `Shift` -
// and arms the timer; every other console key is swallowed, so nothing typed
// while looking back is queued for the first step after the resume.
function scrubKeyDown (event) {
    const direction = event.code === "ArrowLeft" ? -1
        : event.code === "ArrowRight" ? 1 : 0;

    if (direction === 0) { return KEYS [event.code] !== undefined; }

    if (event.repeat) { return true; }

    scrubRelease ();

    scrubKey = event.code;

    scrubMove (direction * (event.shiftKey ? SCRUB_SHIFT_TAP : 1), false);

    const shift = event.shiftKey;

    scrubTimer = setTimeout (() => scrubHold (direction, shift),
        SCRUB_HOLD_MS);

    return true;
}

// The pacing, on the page's own animation frame. Plain arithmetic rather than
// the `Clock`, because the clock steps the session and the whole of this is
// that nothing steps: frames due since the run started, less what has been
// posted, which on a 120 Hz display alternates nothing and one.
function scrubPace (now) {
    if (! scrubRun) { return; }

    if (scrubRun.started === null) { scrubRun.started = now; }

    const due = Math.floor ((now - scrubRun.started) * FRAME_RATE / 1000)
        - scrubRun.sent;

    if (due <= 0) { return; }

    scrubRun.sent += due;

    scrubMove (due * scrubRun.rate * scrubRun.direction, scrubRun.sound);
}

// Where the cursor landed. A run that has reached the end it was heading for
// stops there, which is also what puts the sound away. An answer that arrives
// after the bar shut - a pause and a resume inside one round trip - is about a
// bar nobody is looking at, and opens nothing.
function scrubLanded (message) {
    if (message.end || ! halt.paused) { return; }

    scrubAt = message;

    if (scrubRun && message.frame === (scrubRun.direction < 0
        ? message.floor : message.head))
    {
        scrubRelease ();
    }

    if (typeof scrubShown === "function") { scrubShown (message); }
}

// ---------------------------------------------------------------------------
// Audio. The game renders its own samples, ON THE AUDIO THREAD.
//
// There is no synthesiser here and no second implementation to keep in step
// with the CLI - `render_audio` runs inside the game's own wasm module, so the
// page and `inspector wav` are playing arithmetic that ran in the same code. A
// ctest renders every golden replay through both targets and compares the
// samples.
//
// WHAT MOVED, AND WHAT DID NOT. The simulation used to render each frame's 800
// samples and post them on, and the processor below was a queue of buffers. It
// is a CONSUMER now, in exactly the sense `player.js`'s `Consumer` is one: it
// holds its own instance of the game's module, it is handed the state block per
// step at the block's own address, and it calls the game's own `render_audio` on
// it inside `process`. So the host still synthesises nothing, `render_audio`
// still takes a `void const *`, and the playheads still live in the published
// state - `madhousearcade`'s `docs/decisions.md:15-17` at `3f4fdb8d` are
// honoured by construction rather than by promise. What it buys is scheduling:
// tick N is 800 samples of the audio clock, rendered when the audio clock
// reaches it, by a producer that is not on the main thread at all.
//
// IT IS ONE OF TWO CONSUMERS, and the other draws. Neither is on this thread:
// the page held one for the picture once and painted from it, and the picture is
// two threads out now, in `render.worker.js`. What crosses to each is a
// description the simulation captured and each renders it with the game's own
// code - the sound per STEP, because a step's state is 800 samples of the audio
// clock and a step whose state was never published is a hole, and the picture
// per published FRAME, because a skipped picture is invisible.
//
// Measured constraints shape this, and every one is in
// `madhousearcade`'s `docs/runs/threaded-host-run.md` or `docs/decisions.md`:
//
// - `addModule` from a blob URL FAILS on file:// with AbortError, while a data:
//   URI works on both file:// and http://. The page is served now, so the blob
//   route would work here - the data: one is kept because it is the one that
//   works everywhere, and swapping it would buy nothing.
// - An AudioContext created without a user gesture starts suspended and stays
//   there, so the first gesture of any kind resumes it.
// - A `WebAssembly.Module` will NOT deserialize into an
//   `AudioWorkletGlobalScope`: posted to the port it arrives at
//   `onmessageerror`. The module's BYTES cross, and `new WebAssembly.Module`
//   compiled them there synchronously, off the main thread - (c). So bytes are
//   posted, and `WebAssembly.compile` takes them now, asynchronously.
// - A `MessagePort` DOES cross, and a dedicated worker on the far end of one
//   feeds the audio thread with no main thread on the path - measured for this
//   milestone by `scratch/probes/port.sh`, three ticks from a worker straight
//   into a processor. That is what lets the simulation post its own ticks,
//   which is the whole of the latency argument: a page relaying them would put
//   the sound back on the thread the simulation left in order to escape.
// ---------------------------------------------------------------------------

// The processor's source, as text: it runs in its own global scope with no
// access to anything here, and an `AudioWorkletGlobalScope` cannot
// `importScripts`. So the FIGURES it needs are interpolated in below and the
// CODE it needs is written out inside it - the twenty-odd lines that do what
// `player.js`'s `Consumer` does, because that class cannot be reached from
// there. The offsets are interpolated rather than restated so that `LAYOUT` in
// `player.js` stays the one hand mirror of `Game` this player has: a third copy
// would be a third thing to move when a member is added at the tail.
const STATE_PLAYER = `
const SAMPLES_PER_FRAME = ${SAMPLES_PER_FRAME};

const GAME_RENDER_AUDIO = ${LAYOUT.game.renderAudio};
const GAME_BYTES = ${LAYOUT.game.bytes};

// Game_Resource_Store's offsets, Game_Data's, the seven trampoline slots in the
// order player.js installs them, and the store's own answers out of the
// rulebook, interpolated with everything else so that LAYOUT and CORE in
// player.js stay the one hand mirror of each this player has.
const STORE_CONTEXT_AT = ${LAYOUT.store.context};
const STORE_LOCK_AT = ${LAYOUT.store.lock};
const STORE_UNLOCK_AT = ${LAYOUT.store.unlock};
const STORE_BYTES = ${LAYOUT.store.bytes};
const DATA_BYTES_AT = ${LAYOUT.data.bytes};
const DATA_SIZE_AT = ${LAYOUT.data.size};
const TRAMPOLINE_SLOTS = ${JSON.stringify (TRAMPOLINE_SLOTS)};
const LOCKED = ${JSON.stringify (CORE.locked)};
const LOCK_TAKEN = ${CORE.lock.taken};
const CLOSED_BYTES = ${CORE.closed.bytes};
const AUDIO_CALL = ${CORE.scope.audio};

// And the sentinel this processor writes into its own record's context. A
// literal rather than an interpolation, and deliberately: the value is written
// here and read here, in one instance's own memory, so it never has to agree
// with the one player.js writes into the simulation's record. What it is for is
// telling this instance's record from anything else a game might pass back,
// which is a question with one asker.
const STORE_CONTEXT = 0x30000000;

// How many TICKS of sound may be waiting to be rendered, which IS the latency:
// each is one 60 Hz frame, 800 samples, so a depth of three is 50 ms between a
// frame being stepped and being heard, plus whatever of a fourth the reader is
// already inside. The trim below runs on every message, so this is a TARGET
// rather than a disaster ceiling - a burst is cut straight back to it - and it
// is also the cushion the queue exists to be, because a producer and a consumer
// both running at 60 Hz hold whatever depth they were left at rather than
// returning to one.
//
// THREE IS A READING NOW RATHER THAN A JUDGEMENT, and the reading is the plan's
// own rule applied to docs/runs/threaded-host-run.md (b): the smallest N for
// which a producer gap longer than N ticks is rarer than p99.9, plus one,
// floored at two. A dedicated worker running a self-correcting setTimeout aimed
// at 16.667 ms, in headless Chrome 152 over 60 seconds, visible: n 3,598,
// p50 16.5 ms, p99 24.6, p99.9 25.6, max 26.1. Gaps longer than ONE tick are
// 1,621 of 3,598 - 45%, and arithmetic rather than jitter, since a producer
// aimed at exactly 60 Hz is over 16.667 ms about half the time by construction.
// Gaps longer than TWO ticks are 0 of 3,598. So N = 2, the depth is 3, and
// moving the producer off the page's animation frame bought no depth back.
//
// WHAT THAT READING CANNOT SEE, said beside it because a number with a figure
// next to it reads settled and this one is not. It was taken in headless
// Chrome, whose animation frame is a timer-driven fake vsync with a 0.3 ms
// spread over 3,600 frames - so it removes exactly the layout, collection and
// compositor jitter this design exists to escape, and a headed browser could
// move it. In the BACKGROUND the same timer is not a slow producer but a
// stopped one - p99.9 767 ms, max 1,584 ms, 293 gaps over two ticks in 60 s -
// which is why the page halts on hidden rather than buffering through it, and
// is not a depth any queue could be built to cover.
//
// The floor of two is the plan's and stands whatever a later reading says. One
// is too few twice over: a queue one tick deep is empty for part of every
// ordinary interval, and process below plays an empty queue as zeros, which is
// a click - and the processor now also has to run render_audio, 1.6 us measured
// on the audio thread, before the quantum that needs the samples. Eight, which
// is what this once was, is far too many: 133 ms that nothing gives back.
//
// It is fixed rather than adaptive, and that is the same sentence as the trim
// having no drain. There was a drain - a message that set the queue length to
// zero - and nothing in this tree ever posted one, so it went. Given a caller
// it would have been wrong rather than merely idle: the depth is the cushion as
// well as the latency, and two clocks at the same rate never rebuild a cushion
// they are robbed of, so a scheme that shrinks needs a way to grow back, and
// growing back is a lag controller this tree has deferred whole.
const QUEUE_TICKS = 3;

// How long a gap between the starts of two quanta has to be before process
// reports it to the page as a stall, in milliseconds. A JUDGEMENT, to be
// revisited from what the log shows: the second Safari reading had the
// longest ordinary gap at 3 to 6 ms (Chrome 6 to 7), and a stall adds about
// its own length as delay - a 100 ms hold added 95 ms - so 20 is clear of the
// one and well short of a sound anybody hears as late.
// docs/archived/fresh-speaker-plan.md section 8 holds both readings.
const STALL_MS = 20;

// And how long after a context's first quantum a gap is marked as startup:
// the probe saw 27 ms in the first moments after a start, so the two are told
// apart rather than either silenced.
const STARTUP_MS = 1000;

// The consumer, on the audio thread. It never calls construct and never calls
// step: what it holds is bytes it was handed plus whatever the module's own
// data segments put there, and what it runs on them is the game's own
// render_audio.
//
// It takes no imports, and it installs TWO things: the trampoline, so that a
// sound description naming a resource by id can be locked, and a rulebook
// instance of its own holding a MIRROR of the simulation's store, filled from
// the rows every tick carries. A renderer calls no host function but lock and
// unlock, and those are answered out of that mirror by the same entry points
// the simulation's store answers out of. What it costs this scope is two more
// modules compiled here, out of bytes rather than out of modules, for the
// reason the game's is: a Module will not deserialize into an
// AudioWorkletGlobalScope and bytes cross without complaint. It happens once
// per run, asynchronously, before anything is playing.
//
// THERE IS NO RUN TO END FROM THE AUDIO THREAD, so a lock the mirror refuses
// answers no bytes and a render_audio that returns holding one is let go of:
// what a game draws for a resource it cannot reach is 800 samples of whatever it
// sounds without one. The refusal a run ends on is the render worker's, which
// holds the same mirror and can say so.
//
// AND NOTHING HERE CAN STALL THE THREAD IT RUNS ON once the run is open: the
// memory is grown once, in open, and never again, and a tick allocates nothing
// this class can avoid. What it cannot avoid is the message objects the
// browser builds on receipt, and a report of a stall, which is the one thing
// process ever posts.
class StatePlayer extends AudioWorkletProcessor {
    constructor () {
        super ();

        // Ticks arrive from the simulation's own thread and are consumed on the
        // audio clock. A queue absorbs the difference. What it holds is state
        // blocks rather than samples now, and the entry for a tick a game
        // reported silent is marked silent and plays the silence below - so
        // an entry is one tick of TIME whichever kind it is.
        //
        // A RING OF ENTRIES MADE HERE AND REUSED, so a tick allocates none:
        // QUEUE_TICKS + 1 of them, because the trim runs after every push and
        // the push is the one moment the queue is a tick past its target.
        // head is the oldest entry and count how many are queued.
        this.ring = [];

        for (let index = 0; index <= QUEUE_TICKS; index++) {
            this.ring.push ({ silent: false, audioState: null, rows: null,
                keep: false, reverse: false, stretch: 1 });
        }

        this.head = 0;
        this.count = 0;

        this.pending = null;
        this.pendingAt = 0;

        // One frame of zeros, for every tick a game reports as silent. The
        // length is the page's own constant, interpolated in with the rest of
        // this source, so a silent tick is exactly as long as a rendered one.
        //
        // Sharing one array across several queued ticks is safe because nothing
        // here ever writes to it and each entry is consumed on its own cursor,
        // so two entries that are the same array play as two frames of silence.
        // It used to double as the queue's sentinel for a silent entry; an
        // entry carries its own stretch now, so a silent one is an entry
        // marked silent and this is only what it plays.
        this.silence = new Int16Array (SAMPLES_PER_FRAME);

        // How many output samples each sample of the block now playing is
        // held for: the stretch its tick was posted with.
        this.stretch = 1;

        // Where a rendered tick is copied to, once per tick. The game renders
        // into its own linear memory at the same address every time; 800
        // shorts is 44 ns, measured.
        this.rendered = new Int16Array (SAMPLES_PER_FRAME);

        this.instance = null;
        this.memory = null;
        this.renderAudio = null;
        this.states = null;

        // The views over the memory, made once the run is open and made again
        // only if the buffer under them is not the one they were made over.
        // memory.grow detaches every view over a buffer, and nothing after open
        // grows this one, so they are made once a run - and checked all the
        // same, because a view over a detached buffer reads nothing.
        this.buffer = null;
        this.bytes = null;
        this.view = null;
        this.samples = null;

        // Where open grew the memory to, which is where the simulation's
        // reserved resource spaces end: no region or resource this instance is
        // handed lies past it.
        this.end = 0;

        // The resources whose bytes this instance has been handed, by id, and
        // the ADDRESS each was written at - which is what a lock is answered
        // with, mirror below says why. By id rather than by address because
        // the simulation's arena recycles a block once the table stops naming
        // it, so one address carries one resource and then another.
        this.accepted = new Map ();

        // The ids a tick's rows name, and what forgets an accepted id they do
        // not: one Set cleared per tick and one callback, both made here.
        this.live = new Set ();

        this.forget = (address, id) => {
            if (! this.live.has (id)) { this.accepted.delete (id); }
        };

        // Whether the page has been told of a resource refused for lying past
        // the end - once an instance, because a host that misplaces one has a
        // defect rather than an accident.
        this.told = false;

        this.rules = null;
        this.store = 0;
        this.lockAt = 0;
        this.closeAt = 0;
        this.storePtr = 0;
        this.call = 0;
        this.rulesBuffer = null;
        this.answers = null;

        // Where the sound description lands. Settled in open below and read
        // once per tick.
        this.description = 0;

        // When the last quantum started and when the first did, by Date.now:
        // performance is not exposed in this scope. -1 before the first.
        this.last = -1;
        this.first = 0;

        // The page opens a run: the module's bytes, the trampoline's and the
        // rulebook's bytes, the addresses its simulation laid down, the regions
        // laid down once, and the port every tick will arrive on. It is the only
        // thing the page ever says here.
        this.port.onmessage = (message) => {
            this.open (message.data.bytes, message.data.trampolineBytes,
                message.data.coreBytes, message.data.layout,
                message.data.regions, message.data.port);
        };
    }

    // The views above, made again only over a new buffer.
    views () {
        const buffer = this.memory.buffer;

        if (buffer === this.buffer) { return; }

        this.buffer = buffer;
        this.bytes = new Uint8Array (buffer);
        this.view = new DataView (buffer);
        this.samples = new Int16Array (buffer, this.samplesPtr,
            SAMPLES_PER_FRAME);
    }

    // And the one over the rulebook's memory, which a lock's answer is read out
    // of, on the same rule.
    answered () {
        const buffer = this.rules.memory.buffer;

        if (buffer !== this.rulesBuffer) {
            this.rulesBuffer = buffer;
            this.answers = new DataView (buffer);
        }

        return this.answers;
    }

    // One region or resource of the simulation's memory, written at its own
    // address into memory open has already grown. False, and nothing written,
    // where it would reach past the end open grew to: that is a host bug,
    // because everything a speaker is handed lies below the end by
    // construction, and growing for it here would be a memory.grow on the
    // audio thread.
    accept (address, bytes) {
        if (! bytes || address + bytes.length > this.end) { return false; }

        this.views ();

        this.bytes.set (bytes, address);

        return true;
    }

    // And the page told of one, once. Nothing is thrown: there is no run to end
    // from here, and what is refused reads as not held, so the game sounds
    // without it.
    refuse (id, address, size) {
        if (this.told) { return; }

        this.told = true;

        this.port.postMessage ({ refused: id, address, size, end: this.end });
    }

    // THE COMPILES ARE ASYNCHRONOUS, all three together, so the engine is free
    // to do them on threads of its own while this one only awaits. Whether it
    // does is the engine's business and is not measured here; what holds either
    // way is phase 2b's rule, that the page starts the context only on the
    // opened this posts last, so nothing is rendered while any of it runs.
    // Ticks that arrive meanwhile wait in their port, which is taken last.
    async open (bytes, trampolineBytes, coreBytes, layout, regions, port) {
        const linked = trampolineBytes && coreBytes && layout.store;

        const host = {
            spawn: () => 0,
            status: () => 0,
            finalize: () => {},
            load: () => 0,
            unload: () => {},
            lock: (answerAt, context, id) =>
                this.lock (answerAt, context, id),
            unlock: (context, id) => this.unlock (context, id),
        };

        const [game, core, shim] = await Promise.all ([
            WebAssembly.compile (bytes),
            linked ? WebAssembly.compile (coreBytes) : null,
            linked ? WebAssembly.compile (trampolineBytes) : null,
        ]);

        const [instance, rulebook, trampoline] = await Promise.all ([
            WebAssembly.instantiate (game, {}),
            core ? WebAssembly.instantiate (core, {}) : null,
            shim ? WebAssembly.instantiate (shim, { host }) : null,
        ]);

        const ex = instance.exports;

        this.instance = instance;
        this.memory = ex.memory;

        this.samplesPtr = layout.samples;

        // What render_audio is handed, and the state block is not among the
        // things this processor is ever posted: a module that renders sound
        // describes it or does not load, so there is nothing here to choose
        // between. 0 for a silent game, whose ticks are all silence and never
        // reach the line that reads this.
        this.description = layout.audioState;

        // THE ONE GROWTH, to where the simulation's reserved resource spaces
        // end. Its arena lays everything this instance is told about below
        // that - the descriptor, the samples, the description, the store's
        // record, the regions - and every resource the speaker may lock lies in
        // one of those spaces, at an address known now. So no message after
        // this one makes this memory grow, and accept refuses rather than
        // grows.
        this.end = layout.resourceSpaceEnd >>> 0;

        const have = this.memory.buffer.byteLength;

        if (this.end > have) {
            this.memory.grow (Math.ceil ((this.end - have) / 65536));
        }

        this.views ();

        // The descriptor, off THIS instance's own factory rather than taken
        // from the simulation's: the function pointer on it is an index into
        // this instance's own table. factory writes host memory at an address
        // the simulation also spent on host memory, so nothing a state can
        // reference is touched.
        this.bytes.fill (0, layout.game, layout.game + GAME_BYTES);

        ex.factory (layout.game);

        this.views ();

        const audioAt =
            this.view.getUint32 (layout.game + GAME_RENDER_AUDIO, true);

        // The two wasm functions this instance needs of its own, the record
        // that names them, and the mirror they answer out of. The record's
        // ADDRESS is the simulation's, published in the layout beside the
        // framebuffer's, because this instance lays no arena down; what goes in
        // it is this instance's own table indices, which is why it is composed
        // here rather than mirrored across.
        //
        // A run opened without the bytes - a host that never sent them - leaves
        // storePtr at 0, which is the null store every renderer accepts. It then
        // answers no id at all, which a game whose description names none never
        // notices.
        this.accepted.clear ();
        this.storePtr = 0;
        this.rules = null;

        if (linked) {
            const rules = rulebook.exports;

            let heap = rules.__heap_base.value ?? rules.__heap_base;

            const alloc = (span) => {
                heap = (heap + 15) & ~15;

                const need = heap + span;
                const have = rules.memory.buffer.byteLength;

                if (need > have) {
                    rules.memory.grow (Math.ceil ((need - have) / 65536));
                }

                const at = heap;

                heap += span;

                return at;
            };

            const maxResourceCount = layout.maxResourceCount >>> 0;
            const maxTaskCount = layout.maxTaskCount >>> 0;

            // The module's byte figures, which bound nothing in a mirror -
            // this instance commits nothing - and travel so that a store is
            // laid out from the same declarations wherever it is laid out.
            const declared = layout.maxResourceBytes ?? {};

            const gameBytes = declared.game >>> 0;
            const videoBytes = declared.video >>> 0;
            const audioBytes = declared.audio >>> 0;
            const textureBytes = declared.texture >>> 0;

            this.store = rules.host_core_resources_begin (alloc (
                rules.host_core_resources_size (maxResourceCount, maxTaskCount,
                    gameBytes, videoBytes, audioBytes, textureBytes)),
                maxResourceCount, maxTaskCount, gameBytes, videoBytes,
                audioBytes, textureBytes) >>> 0;

            this.lockAt = alloc (LOCKED.stride);
            this.closeAt = alloc (CLOSED_BYTES);
            this.rules = rules;

            // The view a lock's answer is read through, made here rather than
            // by the first lock, which is on the audio thread.
            this.answered ();

            const table = ex.__indirect_function_table;
            const at = table.grow (TRAMPOLINE_SLOTS.length);

            TRAMPOLINE_SLOTS.forEach ((name, index) => {
                table.set (at + index, trampoline.exports [name]);
            });

            this.view.setUint32 (layout.store + STORE_CONTEXT_AT, STORE_CONTEXT,
                true);
            this.view.setUint32 (layout.store + STORE_LOCK_AT,
                at + TRAMPOLINE_SLOTS.indexOf ('lock'), true);
            this.view.setUint32 (layout.store + STORE_UNLOCK_AT,
                at + TRAMPOLINE_SLOTS.indexOf ('unlock'), true);

            this.storePtr = layout.store;
        }

        // A table entry is a function and survives a growth where a view would
        // not. Null is a game that declares no render_audio, and every tick of
        // one plays as the silence above.
        this.renderAudio = audioAt
            ? ex.__indirect_function_table.get (audioAt) : null;

        // The regions the host laid down once and never writes again: the
        // argument storage and the save blob construct was handed. A game may
        // hold a pointer into either, so both are here before the first state
        // can be rendered.
        for (const region of regions || []) {
            if (! this.accept (region.address, region.bytes)) {
                this.refuse (0, region.address,
                    region.bytes ? region.bytes.length : 0);
            }
        }

        // A new run is a new linear memory on both sides, so whatever this queue
        // was holding belongs to a session that no longer exists. This is not
        // the drain the comment above refuses - that one emptied a queue mid-run
        // and robbed it of its cushion; this is the queue of the run that ended.
        this.head = 0;
        this.count = 0;
        this.pending = null;
        this.pendingAt = 0;

        if (this.states) { this.states.close (); }

        this.states = port;

        // The handler that runs on the audio thread, and it has to stay trivial:
        // two branches, one entry filled and the trim. Indexed loops and
        // reused entries, so that it allocates nothing of its own.
        this.states.onmessage = (message) => {
            // The resources scoped for render_audio this instance has not been
            // handed, at their own addresses AND under their own ids, taken on
            // receipt rather than when the tick is rendered: a tick trimmed off
            // the queue below must not take bytes a later tick names with it.
            const fresh = message.data.fresh;

            for (let index = 0; fresh && index < fresh.length; index++) {
                const resource = fresh [index];

                if (this.accept (resource.address, resource.bytes)) {
                    this.accepted.set (resource.id, resource.address);
                } else {
                    this.refuse (resource.id, resource.address,
                        resource.bytes ? resource.bytes.length : 0);
                }
            }

            // A DELIVERY IS NOT A TICK. It is the bytes alone, handed to a
            // speaker the page has just built in place of one it put away -
            // every resource the live table names for render_audio, which the
            // closed instance held and this one does not. A tick is time and a
            // delivery is not, so it fills no entry and trims nothing.
            if (message.data.delivery) { return; }

            // A silent tick takes a queue slot like any other, because what the
            // queue really holds is TIME. Dropped instead, it would drain 800
