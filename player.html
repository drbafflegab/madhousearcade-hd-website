// whether `outerWidth`/`outerHeight` moved, and whether entering fullscreen
// moves them is a browser's business: where it does, the verdict is `window`
// and the refit happens; where it does not, the verdict is `zoom` and the page
// declines to refit, leaving the canvas at its windowed size on a full screen.
// Measured here it moves them, in one browser; `madhousearcade`'s
// `docs/decisions.md`, item 21, has `outerWidth` unmeasured elsewhere.
//
// So the baseline is DROPPED instead, on the way IN. `layoutChange` returns
// `window` when it has nothing to compare against, which is how the first paint
// lays itself out; clearing `lastLayout` reuses that rule to force the refit
// rather than adding a branch to a function whose whole job is telling these
// cases apart. It is also why the ordering does not matter: `resize` was
// measured arriving AFTER `fullscreenchange`, so the call below may read the
// window before it has finished changing, and the resize that follows then
// refits against a baseline that is merely stale rather than wrong.
//
// LEAVING IS NOT THE SAME OPERATION AND MUST NOT FORCE A REFIT, which is a bug
// this page shipped. A refit reads the window in CSS pixels, and a CSS pixel is
// what page zoom moves - so the box `canvasScale` returns is only right at the
// zoom it was measured at. Every other path is kept away from that by
// `layoutChange` declining to refit on a zoom; forcing one here was the single
// door left open, and it let a zoom level be baked into the canvas.
//
// The sequence a player reported, and it reproduces in the arithmetic alone -
// `tests/layout.js` runs it. Zoom out, enter fullscreen, leave it: the forced
// refit runs against the zoomed-out reading, takes a much larger multiple, and
// sizes the canvas 1680 CSS px where 720 was right. Zoom back in and the page
// correctly declines to refit, so the canvas stays 1680 in a 1440 px window -
// wider than the window, with no way back to a sane size, because every further
// zoom is declined for the same good reason. It is not one browser's problem:
// the box is `240 * scale / ratio`, so Chrome moving the ratio with a zoom
// cancels against the smaller multiple it then takes, and both land on 1680.
//
// So leaving RESTORES the box the canvas had before fullscreen took the window,
// rather than working one out again. That box was computed at the windowed size
// and is still the right answer for it, and it carries the zoom it was measured
// at in the only way a CSS length can - by being a CSS length.
//
// What this does NOT cover, stated rather than left to be discovered: a zoom
// performed WHILE fullscreen is left to restore a box measured at the zoom
// before it. That is the same defect one level down, undoing it needs the zoom
// factor - which no browser reports - and it is a rarer sequence than the one
// above.

const fullButton = document.getElementById ("full");

function toggleFullscreen () {
    if (document.fullscreenElement) { document.exitFullscreen (); return; }

    // A rejected request is reported ON THE BUTTON rather than through
    // `refuse`, and the difference is whether the run survives it. `refuse` is
    // for a page that cannot go on - no module, bytes that are not wasm - so it
    // throws, and the handler at the top of this file replaces the HUD's
    // `textContent`, which takes the frame counter and all four buttons with
    // it. A declined fullscreen request is not that: the game is still playing
    // and every other control still works. The button the player just pressed
    // is where they are looking, it is the smallest thing that can carry the
    // answer, and the next successful change puts the label back.
    const request = document.documentElement.requestFullscreen ();

    if (request && request.catch) {
        request.catch (error => {
            fullButton.textContent = "Fullscreen refused";
            fullButton.title = error.message;
        });
    }
}

// The CSS box the canvas had while the page was a window, so that leaving
// fullscreen can put it back. Read off the element rather than recomputed,
// because what has to be restored is the box that was actually in use - the
// grid correction `fitCanvas` applied to it included.

let windowedBox = null;

document.addEventListener ("fullscreenchange", () => {
    fullButton.textContent =
        document.fullscreenElement ? "Exit fullscreen (F)" : "Fullscreen (F)";

    if (document.fullscreenElement) {
        windowedBox = {
            width: canvas.style.width,
            height: canvas.style.height,
            transform: canvas.style.transform,
        };

        lastLayout = null;
        onLayout ();
    }
    else if (windowedBox) {
        // The baseline still moves, because the window really did change size
        // and the next resize has to be measured against what is there now.
        // Only the refit is declined.
        lastLayout = reading ();

        canvas.style.width = windowedBox.width;
        canvas.style.height = windowedBox.height;
        canvas.style.transform = windowedBox.transform;

        windowedBox = null;
    }
    else {
        // Nothing saved means this handler never saw the page enter, which no
        // sequence here produces. Fitting is the safe answer rather than
        // leaving the canvas at a size that was measured for a whole screen.
        lastLayout = null;
        onLayout ();
    }

    // A resting game paints nothing, and a game that is running paints only
    // what it does not claim is unchanged - so from here on the canvas holds
    // the last frame drawn until the game itself moves a pixel. Nothing about a
    // fullscreen transition is visible to a game, so nothing about it can move
    // that claim, and the page repaints on its own account. `redraw` says what
    // that costs and why it is spent on a transition that may well not need it.
    redraw ();
});

// Hidden rather than left to fail: iPhone Safari has no element fullscreen at
// all - `<video>` there gets a native player nothing else is offered - and a
// button that does nothing is worse than one that is not there. `F` is left
// bound, because it is inert for the same reason and costs nothing.

if (! document.fullscreenEnabled) { fullButton.hidden = true; }

fullButton.addEventListener ("click", toggleFullscreen);

// A full repaint, whatever the last frame claimed. For everything that changes
// what the canvas is or where it sits without any of it being visible to the
// game: a refit, entering or leaving fullscreen, the HUD coming and going, and
// coming back from a pause.
//
// A MESSAGE TO THE RENDERER although the page draws, and the reason is the one
// thing a redraw cannot do. `loop` below draws the list it holds on every
// animation frame it is given, at whatever size the buffer now is, so the
// picture already follows a refit sixty times a second. What a caller here
// wants is the list MADE again whatever the last step claimed, and
// `render_video` and the list's check are on that thread.
//
// It is answered on the message rather than on any frame, which
// `render.worker.js`'s `repaint` case states from the other end: a repaint is
// one request rather than a burst to coalesce, and one of the callers below is
// a hidden tab coming back, which is exactly where a rate of any kind is the
// thing that is not running.
//
// It costs one `render_video` and one list over the description that instance
// is already holding. Nothing is asked of the simulation, which may well be
// halted while this runs. None of those callers is KNOWN to need it: the still
// claim is a claim about the GAME's list and says nothing about the browser's,
// so the page keeps the right to disbelieve it.

function redraw () { if (render) { render.postMessage ({ kind: "repaint" }); } }

// ---------------------------------------------------------------------------
// THE COMMIT: the newest list this page holds, drawn into the canvas.
//
// Called from `loop` below and from nowhere else, once per animation frame the
// browser gives this page, which is the display's own rate in both browsers and
// is the whole reason the page draws. The renderer runs `render_video` on a
// thread of its own and transfers the list; this is the other half, and
// between them they are the shipped picture. The whole buffer is cleared to
// `background` and the list drawn into the frame's box, so the letterbox and
// an undrawn frame read the same.
//
// IT DRAWS WHETHER OR NOT A NEW LIST ARRIVED. A 2D canvas nothing wrote went to
// sleep in `madhousearcade` - a run rested ten seconds under a still cursor and
// showed its next slide a few hundred milliseconds late - and a commit every
// frame was what kept it awake (that tree's `docs/runs/scan-out-run.md` at
// `3f4fdb8d`). Nothing a thread could see said an undrawn WebGL2 canvas sleeps
// in either browser here, but that old sleep was an eye's reading and no thread
// can see the layer's commit path (`docs/runs/webgl2-probe-run.md` section 3),
// so the redraw is kept on the old reading. It costs 0.3 ms of GPU a frame at
// 500 sprites.
//
// THE MARK IS MADE ONLY ON A NEW PICTURE. `RenderWatch` waits on the newest
// description the simulation PUBLISHED reaching the screen, so a mark made for
// a list already drawn would clear a wait the renderer still owes and a wedged
// instance would report itself alive sixty times a second. A redraw is a
// commit and not a draw.
//
// AND THE PROBE'S STAMP, on a page that said `?probe=present`: the frame the
// list was made from, in bars across the top of the frame, drawn over the
// picture as `stampBands` lays them out, for `probe.js` to read off a capture.
// ---------------------------------------------------------------------------

function commitPicture () {
    if (! presenter || ! declaration || presenter.lost) { return; }

    const box = frameBox (canvas.width, canvas.height, declaration.frameWidth,
        declaration.frameHeight);

    presenter.draw (shownList ? shownList.sprites : null,
        declaration.background, box, declaration.frameWidth,
        declaration.frameHeight);

    if (! shownList) { return; }

    if (probing) {
        presenter.bands (stampBands (shownFrame, declaration.frameWidth), box);
    }

    if (shownCommitted === shownFrame) { return; }

    shownCommitted = shownFrame;

    renderWatch.drew (shownFrame);

    // And the probe's own half of that mark: when a picture reached the canvas
    // here, and which frame it was drawn from. `probe.js` matches that against
    // the frame numbers its capture decoded off the SCREEN, and the difference
    // between the two is the whole reading. Guarded on the function rather than
    // on the flag alone, because the file is fetched and a list can beat it
    // here.
    if (probing && typeof probeDrew === "function") {
        probeDrew (performance.now (), shownFrame);
    }
}

// The worklet's own run, opened once the worklet exists: the module's bytes,
// the addresses the simulation laid down, the regions it laid down once, and
// the page's end of the channel the simulation is already posting ticks into.
//
// It is the LAST thing this page does about sound. After this message the
// simulation posts every tick straight to the audio thread and no frame of
// sound crosses this one - which is what the whole change is for, because a
// main thread stalled by layout, a collection or an extension would otherwise
// stall the speaker with it.
//
// It waits on `synth.ready`, which is its predecessor's close, `addModule` and
// the node, and that wait is why the channel is made in `reset` instead of
// here: a port holds what is posted to it and carries its queue across the
// transfer, so the ticks of the wait are heard rather than dropped.
//
// A page whose worklet never arrived tells the simulation so, and that is not
// tidiness: the far end would otherwise go on posting a state block a tick into
// a port nothing drains, which for `madhousearcade`'s `games/suika` at
// `3f4fdb8d` is 358 KB a second that nothing ever frees.
//
// A `reset` between the two halves is why the worker is captured and compared
// rather than read twice: the answer belongs to the run that asked, and the run
// that replaced it has a channel of its own.

// The renderer's own run, opened the moment the simulation says where its arena
// put things: the module's bytes, those addresses, the regions laid down once,
// and the page's end of the channel the simulation is already posting
// descriptions into.
//
// AND NOT THE CANVAS. The element is never handed anywhere: the thread this
// opens makes a list and transfers it here, and `commitPicture` above draws it.
// So there is one transfer, and it is the port.
//
// It is still the LAST thing this page does about what a list is MADE of.
// `render_video`, the list's check and every resource the description can name
// are that thread's, which is what the split is for: a renderer that never
// returns wedges a thread the page can replace rather than the tab.
//
// It waits on nothing, unlike `openAudio` below it, because there is nothing to
// wait for: a dedicated worker is ready the moment it is constructed and its own
// `importScripts` happens on its own thread. So there is no window in which a
// reset could replace the run underneath this, and no worker to compare.

function openRender (layout, regions) {
    if (! render || ! screenPort) { return; }

    // The BYTES rather than the compiled module, for the reason the worklet
    // gets bytes: one spelling for "a consumer compiles its own instance", and
    // the page is holding them anyway because `declaration` compiles from them.
    // The trampoline is the compiled module, which does clone to a dedicated
    // worker, exactly as the simulation is handed it.
    render.postMessage ({
        kind: "open",
        bytes: wasmBytes,
        trampoline,
        core,
        layout,
        resident: regions,
        port: screenPort,
    }, [screenPort]);

    // Spent: a port belongs to the thread it was transferred to, and this page
    // has nothing left to do with it.
    screenPort = null;
}

// Everything the renderer says, which is three things: it is open, here is a
// list, and here are a texture's four levels.
//
// It is asked nothing but a repaint, which is the shape the whole split bought.
// The simulation posts descriptions straight down a channel this page is not
// on, the renderer runs the game's own renderer over them, and what crosses
// back here is a list - which is both what the picture is drawn from and the
// one fact a page needs about another thread: that it is still there.
// `RenderWatch` in `player.js` reads the second out of `commitPicture`.
//
// A message from a renderer this page has replaced never arrives, for `fromSim`'s
// own reason one thread over: the outgoing thread is terminated before the new
// one is built, so there is no answer in flight to attribute to the wrong
// worker.

function fromRender (message) {
    switch (message.kind) {

    // The instance is compiled and the channel is being listened to. Nothing
    // has been drawn, and that is the point: this is what makes a renderer that
    // never draws ONCE reportable.
    case "ready":
        renderWatch.opened ();

        break;

    // The list itself, as the renderer transferred it.
    //
    // NOTHING IS DRAWN HERE. The list is held, and `commitPicture` above draws
    // it on the page's own animation frame - which is the display's. A list
    // arriving between two frames replaces the one the page was holding rather
    // than queueing behind it: a picture is a function of ONE description, and
    // a screen shows one frame per update.
    //
    // And the textures its table no longer names are deleted on the same
    // instant, since every list that could name one has now been handed over -
    // except for a scrubbed list, whose table is an old one and says nothing
    // about what the run holds now. A scrubbed frame from before an unload
    // draws without the texture it lost.
    case "list":
        shownList = { sprites: new Uint8Array (message.sprites) };
        shownFrame = message.frame;

        if (presenter && ! message.scrub) { presenter.retire (message.live); }

        break;

    // A texture's four levels, cut out of its file by the renderer, uploaded
    // here, and said to the simulation, whose answer to the load has been
    // waiting on exactly this. A texture this page already holds - a
    // replacement renderer cut it again - is said again and not uploaded twice.
    //
    // One the browser would not cut, or the GPU would not take, fails its load
    // rather than the run: the simulation abandons the task, which is the
    // game's fallback and what a recording of this run then says, as a load
    // past `game_texture_size_max` is on every host.
    case "levels": {
        let refused = message.levels ? null
            : `the browser would not cut its levels: ${message.reason}`;

        if (! refused && presenter && ! presenter.has (message.id)) {
            refused = presenter.upload (message.id, message.width,
                message.height, message.levels);
        }

        for (const level of message.levels || []) { level.close (); }

        if (refused) {
            console.warn (`player: ${message.file} is not on the GPU, so its `
                + `load fails: ${refused}`);
        }

        post ({ kind: "textured", ids: [message.id], failed: refused !== null });

        break;
    }
    }
}

// The renderer stopped answering while the simulation went on publishing, so it
// is ended and another is built behind the picture it left.
//
// THIS IS WHAT THE DISPLAY FRAME BOUGHT. A `render_video` that never returns
// used to take the run with it, because it ran on the thread that steps: the
// page's watchdog terminated the simulation and the session was over.
// `madhousearcade`'s `docs/archived/render-worker-plan.md` at `3f4fdb8d` traded
// one display frame of latency for a renderer the page can replace, and this
// function is the whole of the second half of that trade.
//
// THE SIMULATION IS NEVER TOUCHED, and that is the gate the plan states rather
// than a nicety: it is not terminated, not reset, not paused and not asked
// anything, so its frame count goes on advancing across every line below. The
// one message it is sent is `viewer`, which is the message it already has for
// being told where to publish - and it is sent for a reason that is not
// bookkeeping. The thread on the far side of the old port is gone, and the
// simulation's record of which resources that consumer holds would otherwise
// keep every live resource from ever being delivered to the new one;
// `sim.worker.js`'s own `viewer` case says what that would cost.
//
// THE ORDER IS THE ONE `seize` KEEPS, for the same reason: the wedged thread is
// ended first, because everything after it takes time a page whose main thread
// is fine can afford and a spinning core is not.
//
// AND THE CANVAS IS NOT TOUCHED EITHER. The element, the GL context and every
// texture on it are the page's for the life of the run, the list it is drawing
// was transferred to this thread and belongs to it, and `loop` goes on drawing
// that last good frame sixty times a second while the replacement fetches,
// compiles and renders its first list.
//
// WHAT THE REPLACEMENT DOES LOSE is whatever texture the dead thread was
// cutting. The simulation hands every file still waiting to the new one when
// `viewer` arrives, so a load whose answer was waiting on the cut still lands.

function replaceRenderer () {
    if (! sim || ! render || ! arena) { return; }

    render.terminate ();

    // And a new channel, in both directions, exactly as `reset` makes the
    // first: the simulation starts publishing into it at once and the port
    // holds what the new worker has not drained, so the frames drawn while it
    // fetches and compiles are drawn rather than dropped.
    const channel = new MessageChannel ();

    screenPort = channel.port1;

    sim.postMessage ({ kind: "viewer", port: channel.port2 },
        [channel.port2]);

    render = new Worker (new URL ("render.worker.js", location.href).href);

    render.onmessage = (event) => fromRender (event.data);

    watchWorker (render, "replacement renderer");

    // Before the worker is opened rather than after, so that nothing can arrive
    // from it against a watch that still believes the dead thread's numbers.
    renderWatch.replace ();

    openRender (arena.layout, arena.resident);

    // Said once, on the console, and said as a warning rather than an alarm:
    // the run is still playing and a banner over it would be the page reporting
    // a failure the player cannot see and does not have. What a person does
    // want, if they ever read this, is the frame it happened on.
    console.warn ("player: the renderer stopped answering while it was drawing "
        + `frame ${renderWatch.shown}, so it was replaced. The simulation was `
        + "not interrupted. A second one ends the run.");
}

async function openAudio (layout, regions) {
    const worker = sim;
    const speaker = synth;
    const port = audioPort;

    audioPort = null;

    if (! port) { return; }

    if (speaker) { await speaker.ready; }

    // A run replaced while this waited: the thread on the far end has been
    // terminated, so there is nobody left to tell and nothing to close but this
    // end of a channel that can no longer carry anything.
    if (worker !== sim) { port.close (); return; }

    // And a SPEAKER replaced while this waited, which is the sound put away
    // twice in quick succession: the replacement brokered a channel of its
    // own and an `openAudio` of its own behind it, and the simulation closed
    // the far end of this one on that `audience`. So this opens nothing - the
    // newer call opens the newer speaker - and its end goes the way the far
    // one went.
    if (speaker !== synth) { port.close (); return; }

    // No worklet, for any of the reasons `Synth.start` catches, or a speaker a
    // page going away closed and did not replace - and the simulation is TOLD,
    // rather than left posting into it.
    if (! speaker || ! speaker.node || speaker.closed) {
        port.close ();

        worker.postMessage ({ kind: "audience", port: null });

        return;
    }

    speaker.open (wasmBytes, trampolineBytes, coreBytes, layout, regions, port);
}

// The sound put away, which REPLACES the speaker rather than suspending it: the
// context is closed and a new `Synth` is built in its place, suspended and
// never started, so the next wake starts a context that has never run.
//
// NOT A SUSPEND, which is what all five callers used to do. Safari keeps a STALL
// on the audio thread as delay - a 200 ms hold inside `process` left the sound
// 200 ms later, and it stayed - where a suspend and a resume add none; and only
// a new context starts at zero. So a put-away is where whatever a stall left is
// cleared. No script can read that delay, so nothing here could replace only
// once it had grown. What a replacement costs - an `addModule`, three modules
// compiled in the worklet and the resources sent again - is paid while nothing
// plays, because the new context runs only once its worklet has opened, and
// what the old context had queued goes with it rather than playing stale on the
// wake.
//
// THE NEW CONTEXT IS BUILT ONLY ONCE THE OLD ONE HAS CLOSED. The `Synth` is
// built at once, so `synth` is never null and every caller goes on working,
// and it is handed the old one's `close` to wait on: a context still open when
// the next is built can keep the old one's delay alive. And a page going away
// builds none - `leaving` above, and `pagehide` below.
//
// A RUN THAT IS LIVE IS BROKERED A CHANNEL, exactly as `reset` brokers the
// first and `replaceRenderer` above brokers a renderer's: the simulation is
// told `audience` with one end, which it takes as a new consumer holding
// nothing and hands the live table's audio resources at once, and `openAudio`
// gives the new worklet the other. With no run - `seize` has just ended it -
// the speaker is only built, and the next `reset` builds its own; and before
// the run has said where its arena is, which is where `reset` calls this, it is
// only built too, because `fromSim`'s `opened` case opens whichever speaker is
// current by then on the channel `reset` made.

function replaceSpeaker () {
    cancelAudioRest ();

    const closing = synth ? synth.close () : null;

    if (leaving) { return; }

    synth = new Synth (closing);

    if (! sim || ! arena) { return; }

    const channel = new MessageChannel ();

    audioPort = channel.port1;

    sim.postMessage ({ kind: "audience", port: channel.port2 },
        [channel.port2]);

    openAudio (arena.layout, arena.resident);
}

// Mark: the playtest hook from the design. Packages the frame index, the
// arguments the run was given and the input log so the run can be replayed to
// exactly this frame.
//
// Mark, Reset and Pause are all live in the DOM before a module is, because the
// page is built once and every game hangs off it. Each answers for the run
// there is not yet, rather than for a null session.
//
// TWO HALVES STILL, and the seam is the browser rather than the thread. What a
// recording is made of - the seed the run really used, the pairs it was told,
// the blob it was constructed from and the five logs - reaches this page as the
// run goes along and is held in `runRecord` below; `markText` in `player.js`
// composes the file out of it, because that is arithmetic over a format and
// needs no browser; and what is left here is the two calls that put text in a
// person's downloads.
//
// IT WAS A ROUND TRIP and is not, and the reason is the watchdog. Mark used to
// post a question and write what came back, which is correct for a page whose
// simulation is answering and useless for the one case a recording is most
// wanted in: a `step` that never returns answers no message, so the moment the
// page most needs the input log was the moment it could not ask for it. Holding
// the record removes the question, which also removes the token that paired an
// answer with it - a player leaning on `M` now writes one file per press with no
// reply to lose track of.

function mark () {
    if (! declaration || ! runRecord) { return; }

    writeMark (runRecord);
}

// The record as a file, downloaded. `frameIndex` is what the run reached, so a
// mark taken by a player names the frames that RAN - and the watchdog hands this
// a record whose count is one higher, because a recording that stops short of
// the frame that wedged reproduces everything except the hang.

function writeMark (record) {
    const blob = new Blob (
        [markText (declaration.name, declaration.version, record)],
        { type: "text/plain" });
    const a = document.createElement ("a");
    a.href = URL.createObjectURL (blob);
    a.download = declaration.name.toLowerCase () + "-mark-" + record.frameIndex
        + ".replay";
    a.click ();
    URL.revokeObjectURL (a.href);
}

// The run is over, so it is ended and said out loud.
//
// `madhousearcade`'s `docs/decisions.md` at `3f4fdb8d`, pending item 10, in the
// four things it asks for: the frame is named, the worker is terminated, the
// recording goes out in Mark's own format, and the report names the command
// that reproduces it natively. `Watchdog` in `player.js` decides WHEN, and
// everything here is what only a browser can do about it.
//
// THREE CALLERS AND THREE SENTENCES, which is why the reason and the frame
// count are passed in rather than composed here. A simulation that stopped
// answering is named by `stallLine` and reproduced one frame PAST what it
// reported finishing, because the frame it reported finishing is the one before
// the frame it stopped in. A renderer that stopped answering for the second time
// in a session is named by `renderStallLine` and reproduced AT the frame the
// picture was owed for, with no offset, because that description is what
// wedged and a recording that ran on past it would render the wrong one. And a
// worker that THREW is named by `workerErrorLine` and recorded one frame past
// what the SIMULATION reported finishing whichever thread threw, which is the
// first caller's arithmetic: the frame that was never finished is the one the
// simulation is inside, whether it threw there or never came back from it. The
// numbers are different arithmetic over different threads, so each caller brings
// its own.
//
// The order matters in one place and one only: the thread is ended first,
// because everything after it takes time a page whose main thread is fine can
// afford and a spinning core is not. `terminate` on a thread spinning inside
// wasm is measured rather than assumed - it resolves in about 2 ms under node,
// and `products/web-player/tests/watchdog.js` asserts the exit rather than
// trusting it.
//
// The sound goes with it. `render_audio` runs in the worklet on states this
// thread no longer receives, so a processor left running would play its queue
// out and then 800 zeros a tick for ever; putting it away is what a halt
// already does for a game that stopped for a better reason. With the
// simulation gone the replacement is only built, and the `reset` after this
// builds one of its own.
//
// AND THE PICTURE, for the same reason and with nothing to close: the renderer
// is a thread holding an instance of a game that no longer runs, so it is ended
// rather than left. The last frame the page DREW stays on screen, which is
// what a person reading the banner over it should see, and it stays there for
// nothing: `stopLoop` below ends the drawing, and a canvas nobody draws to
// again goes on showing the last picture it presented. Where a renderer was
// replaced and then stopped again, that is still the last list the first one
// made, because the replacement never sent one to take its place.
//
// AND THE FILE MAY BE REFUSED, which is worth writing down rather than
// discovering. A browser may decline a download that no gesture asked for, and
// nothing here is a gesture - a frame callback noticed the silence. What makes
// that survivable is that the record is the page's: `M` still works after this,
// because there is no worker left to ask and there never needed to be one.

function seize (reason, frames) {
    sim.terminate ();
    sim = null;

    if (render) { render.terminate (); render = null; }

    stopLoop ();

    if (audioPort) { audioPort.close (); audioPort = null; }

    if (screenPort) { screenPort.close (); screenPort = null; }

    if (synth) { replaceSpeaker (); }

    showAlarm (reason);

    console.error ("player: " + reason);

    // The frames the recording asks for, which its caller worked out: the
    // block above says why the two callers cannot share one number.
    //
    // The record is moved on rather than a copy of it written, so that pressing
    // `M` after this writes the same file the page just wrote. A player who
    // never saw the download - a browser may decline one no gesture asked for -
    // must not get a recording one frame short of the only frame that matters.
    if (runRecord) {
        runRecord.frameIndex = frames;

        writeMark (runRecord);
    }
}

// A worker's uncaught exception, which nothing else on this page would see.
//
// A dedicated worker goes on running after it throws, and both heartbeats this
// page reads are posted only after the work they report has completed - so a
// throw inside either handler reads from here as silence, and a second later a
// watchdog reports it as a hang it cannot tell from one. `workerErrorLine` in
// `player.js` argues the whole of that and composes the sentence; what is left
// here is the three things only a browser can do - take the event, keep the
// browser from printing it a second time, and end the run through the same
// `seize` a stall ends it, recording included.
//
// THE FRAME COUNT IS THE SIMULATION'S, one past what it reported finishing,
// which is `stallLine`'s caller's arithmetic and not `renderStallLine`'s: the
// frame that stopped is the one the simulation is inside, whichever thread
// threw, because that is the frame a recording has to reach to arrive where the
// run ended.
//
// A RUN THAT HAS ALREADY ENDED is left alone. `seize` terminates the simulation
// and drops it, so a second exception - the renderer throwing as its thread is
// torn down, or both workers throwing on one frame - would seize a null.

function watchWorker (worker, which) {
    worker.onerror = (event) => {
        if (event.preventDefault) { event.preventDefault (); }

        if (! sim) { return; }

        seize (workerErrorLine (which, event.message, event.filename,
            event.lineno, watchdog.completed, renderWatch.shown),
            watchdog.completed + 1);
    };
}

function reset () {
    if (! wasmBytes) { return; }

    // What the outgoing run leaves behind, in the order the three have to
    // happen in.
    //
    // Its store first, because a reset is a new run rather than a lost one: the
    // game about to be built reads that store back in `construct`, so without
    // this a player who pressed R and then closed the tab would have the reset
    // run recorded and the run before it forgotten. Written out of the blob the
    // outgoing run's last stepped frame carried, which is what makes it possible
    // at all here: the thread that could render one is about to be terminated,
    // and a page that had to ask it for a blob first would be asking across a
    // round trip it does not have.
    //
    // Then the simulation's own thread, and every worker it is still holding -
    // one per body in the air - because a thread running a body for a game that
    // no longer exists is a core spent on an answer nothing will read, and its
    // message would reach a linear memory nothing is playing out of. `close`
    // asks for the bodies and `terminate` takes the thread: the first is the
    // session's own `runner.stop`, and the second is what makes a reset a new
    // linear memory on the far side as well as this one.
    //
    // And the renderer with it, in the same two moves: its instance is the
    // outgoing run's linear memory as much as the simulation's is.
    writeSave ();

    if (sim) {
        sim.postMessage ({ kind: "close" });
        sim.terminate ();
        sim = null;
    }

    // A message the outgoing run was never handed goes with it: the run it was
    // said to no longer exists, and the next one starts told nothing.
    undelivered = 0;

    if (render) {
        render.postMessage ({ kind: "close" });
        render.terminate ();
        render = null;
    }

    // And this page's ends of the outgoing run's two channels, if the worklet
    // and the renderer never took them. The other ends went into a thread that
    // has just been terminated, so nothing will ever post to them again.
    if (audioPort) { audioPort.close (); audioPort = null; }

    if (screenPort) { screenPort.close (); screenPort = null; }

    // And what the outgoing run would have kept, which has just been written and
    // belongs to a game that no longer exists.
    keptSave = null;

    // And the things that belong to the outgoing run rather than to the page:
    // what it would have been recorded as, the two waits for answers it is no
    // longer owed, and where its arena put things. A watchdog carried across a
    // reset would count the silence of a thread that has been terminated on
    // purpose, and a replacement already spent would be spent against the wrong
    // run.
    runRecord = null;
    runHash = null;
    forwarding = resuming;
    watchdog = new Watchdog ();
    renderWatch = new RenderWatch ();
    arena = null;

    // And the picture, with every texture it was drawn from. A new run mints
    // its resource ids from 1 again, so a texture the outgoing run uploaded
    // would answer for an id the new one has not loaded yet; they are deleted
    // here, the held list with them, and the canvas shows the background until
    // the new run's first list - which, for a game whose first picture waits on
    // its sheet, is what it would show anyway. Both frame numbers go to zero,
    // because a frame number carried across would be compared against the new
    // run's own count, and a watchdog reading a debt against a draw five
    // hundred frames in the future would owe nothing for five hundred frames.
    if (presenter) { presenter.forget (); }

    shownList = null;
    shownFrame = 0;
    shownCommitted = 0;

    gameModule = new WebAssembly.Module (wasmBytes);

    declaration = new Consumer (gameModule, null);

    // The STORE is the one thing here that outlives the page, and it stays on
    // this side of the worker because it has to: `localStorage` does not exist
    // on a worker's thread. So the page reads it and hands the blob over with
    // everything else the run was told, and the page writes it back out of the
    // blob the simulation pushes with every frame that stepped - which is what
    // makes a save on `pagehide` possible with no round trip left to take.
    //
    // Null where this browser has storage turned off, which is a page that plays
    // and forgets rather than a page that refuses, and null for a game that
    // persists nothing - `Session` then hands `construct` the null
    // `interface/game.h` names for that case and for no other.
    const saved = saveStore && declaration.saveSize
        ? saveStore.read (declaration.name, declaration.saveSize)
        : null;

    // The worker's URL is the PLAYER's rather than the module's, exactly as the
    // decoder's is and for the same reason: one page plays every game, so a
    // file resolved against a game would have to be copied into every game's
    // directory to be found. Handed over rather than left out, because a
    // session without it runs bodies on this thread - correct, and the page
    // frozen for the length of a search, which is the whole thing tasks exist
    // to remove.
    // The resource directory goes with it, because a body reads its own files
    // now: the session posts the directory to a body's worker with the module,
    // and every fetch a run makes happens on that thread inside the read that
    // wanted it. A new session is a new set of workers and a new linear memory,
    // so nothing a previous run fetched is still reachable and nothing has to be
    // invalidated - the bytes are fetched again, which is one round trip and
    // never a stale pointer.
    //
    // The seed and the arguments are the one thing that does NOT come back new:
    // the same number and the same list every reset, decided once out of the
    // address above, so that the address bar describes what is on screen for
    // the whole life of the page and R is a reset rather than a reroll. The
    // MEMORY the pairs live in is new every time, because a new session is a
    // new linear memory - which is what keeps laying them down once per session
    // from leaking.
    //
    // AND THE THREAD IT ALL HAPPENS ON. `sim.worker.js` builds the `Session`
    // out of exactly what used to be passed here, one message along, and answers
    // with the addresses its arena laid down; nothing about what a session is
    // told has moved, only where it is told it.
    //
    // The module's bytes rather than the compiled module, and the two compiled
    // ones beside them because they already are: `fetchModule` answers bytes
    // and `fetchTrampoline` and `fetchCore` answer modules, and a
    // `WebAssembly.Module` clones to a dedicated worker because the two share an
    // agent cluster - measured in `madhousearcade`'s
    // `docs/archived/unified-tasks-phase0/probes.md` at `3f4fdb8d`, section 1.
    // The page keeps the bytes because `declaration` above compiles from them.
    sim = new Worker (new URL ("sim.worker.js", location.href).href);

    sim.onmessage = (event) => fromSim (event.data);

    watchWorker (sim, "simulation");

    // And the thread that draws, started here beside it and opened later: what
    // a renderer has to be told is where the simulation's arena put things, and
    // that is not known until the simulation answers. Started now all the same,
    // because starting a worker is a fetch and a compile and both are round
    // trips this run may as well spend while the session is being built.
    render = new Worker (new URL ("render.worker.js", location.href).href);

    render.onmessage = (event) => fromRender (event.data);

    watchWorker (render, "renderer");

    // AND THE SCREEN, which is not handed anywhere: the same element every run,
    // its box fitted to whatever frame this module declares and its drawing
    // buffer made that box's device pixels. `reset` is where this is because
    // `reset` is the first moment there is a declaration to fit against.
    fitCanvas ();

    sim.postMessage ({
        kind: "open",
        bytes: wasmBytes,
        trampoline,
        core,
        seed: runSeed,
        args: runArguments,
        workerUrl: new URL ("task.worker.js", location.href).href,
        resources: { base: resourceDirectory.href },
        saved,

        // The recording this run plays instead of the mouse, or null on every
        // run that is not a probe's. Its header outranks the seed, the pairs
        // and the blob above, which is what makes a replayed run the RECORDED
        // run rather than this one with somebody else's input on it -
        // `sim.worker.js`'s driver holds that rule and says why the page may
        // compose this field from nothing but the probe's own query.
        replay: replayText,

        // Or the recording this run starts from and plays on past, on a page
        // opened with `resume=message` and on no other.
        resume: resuming ? resumeText : null,

        // Whether the simulation keeps the scrub bar's ring, which is
        // allocated and filled only where the address said `scrub=on`.
        scrub: scrubbing,

        // AND NOTHING ABOUT TIME, which is what moving the clock here took off
        // this message. It used to carry `performance.timeOrigin`, because a
        // dedicated worker's clock counts from its own creation and the worker
        // asked the display for its own frames, so every callback's timestamp
        // there had to be subtracted back onto the zero `event.timeStamp` stands
        // on here. `loop` below posts the timestamp now and it is already on
        // that zero. It used to carry `running` beside it as well, because a
        // thread that asks for its own frames needs telling that this run is
        // halted at birth; a thread that steps on what this page posts does not,
        // because a halted page reaches `loop` and posts nothing.
    });

    // The slow motion `S` chose, carried into the new run: a new thread starts
    // at the console's rate and is told otherwise right behind its `open`.
    if (scrubbing && scrubTempo !== 1) {
        sim.postMessage ({ kind: "tempo", divisor: scrubTempo });
    }

    // The channel the sound will take, made here and given away in two
    // directions: one end goes to the simulation now, and the other to the
    // worklet as soon as there is one. From then on a tick reaches the speaker
    // without this thread being involved at all, which is the property a page
    // relaying every frame would have thrown away.
    //
    // Before the first tick rather than after the worklet is ready, because a
    // port holds what is posted to it and carries its queue across the
    // transfer: the frames a run sounds while `addModule` resolves are heard.
    //
    // AND A SPEAKER OF ITS OWN at the far end, the first at load among them.
    // The old one is closed as a put-away closes it rather than handed the new
    // run, because handing it one opens a run on an audio thread that is
    // playing. The new one is asked for the sound unless the run is silenced,
    // and `Synth` holds that until its worklet has opened.
    replaceSpeaker ();

    if (! silenced (halt)) { synth.resume (); }

    const channel = new MessageChannel ();

    audioPort = channel.port1;

    sim.postMessage ({ kind: "audience", port: channel.port2 },
        [channel.port2]);

    // And the channel the PICTURE will take, made the same way and for the same
    // reason: the simulation starts posting descriptions into it at once, and
    // the renderer takes the queue with the port when `openRender` hands it
    // over. Two channels rather than one, because the two consumers are told
    // different things at different cadences and a shared port would make each
    // of them read past the other's messages.
    const screenChannel = new MessageChannel ();

    screenPort = screenChannel.port1;

    sim.postMessage ({ kind: "viewer", port: screenChannel.port2 },
        [screenChannel.port2]);

    describe ();

    // A new run has everything to do, whatever the old one had run out of.
    // `paused` and `hidden` are deliberately left alone - resetting is not
    // unpausing, and a reset behind a menu is still behind it - but a game that
    // no longer exists cannot be the reason the loop is stopped.
    wake ();

    // And the loop, armed HERE because a run existing is the whole of what arms
    // it. `runLoop` is idempotent and this is a run that already had a loop on
    // every path but one: the path where `seize` ended the last run, dropped
    // the simulation and stopped the chain, and `R` is what builds the next.
    runLoop ();
}

// Everything the simulation says, which is three things: the arena it laid down,
// a tick's worth of work, and a task that has become ready. A recording used to
// be a fourth and is not, because the page holds one rather than asking for it -
// `mark` above says why, and the answer is a thread that cannot answer.
//
// A message from a worker this page has replaced never arrives, and that is
// `reset`'s doing rather than a check here: the outgoing thread is terminated
// before the new one is built, so there is no answer in flight to attribute to
// the wrong run. It is the same sentence `Session.onStaged` carries one thread
// over, kept by the same move - ending the thread rather than filtering what it
// says.

function fromSim (message) {
    switch (message.kind) {

    case "opened":
        // What a recording says before its first record, and the only part of
        // one that cannot change: the seed the run really used, the blob it was
        // constructed from and the pairs it was told. It is also what says a run
        // has opened at all, which is what the frame case below reads.
        runRecord = openRecord (message);

        // And what this run would keep before it has stepped at all, which is
        // the one blob no game asks for: `construct` may have rewritten a field
        // on the way in, and a tab closed before the first request has to write
        // those bytes rather than the ones the store already held. Kept exactly
        // as a frame's is, through the same slot, so nothing below this can tell
        // which message a blob arrived on.
        if (message.save && ! resuming) { keptSave = message.save; }

        // The addresses the simulation laid down and the regions it laid down
        // once, to BOTH consumers: each is an instance of the same module
        // rendering the same bytes, one thread over, and each needs both
        // because a renderer may follow a pointer into the argument storage,
        // the save blob or a task's output, which is
        // `interface/game.h:35-50`'s list.
        //
        // The renderer first, because it is the one with a person waiting on
        // it: the sound waits on `addModule` either way, and a frame drawn
        // sooner is the whole of what the argument about this player's latency
        // has ever been about.
        //
        // KEPT AS WELL AS SPENT, because a renderer this page has to REPLACE
        // is told exactly what this one is being told and the thread that
        // knows it must not be interrupted to ask. `arena` above prices what
        // holding it costs.
        arena = { layout: message.layout, resident: message.resident };

        openRender (message.layout, message.resident);
        openAudio (message.layout, message.resident);

        // A run opened under a pause - `R` pressed with the bar open, or
        // `Enter` before the module landed - opens the bar on its own ring,
        // because no pause is going to arrive to do it. A run of the old ring
        // still under way is let go first: its frames are not this ring's.
        if (scrubbing && halt.paused) { scrubRelease (); scrubBegin (); }

        break;

    case "frame": {
        if (! runRecord) { break; }

        // The simulation is alive and this is where it has got to. First,
        // because what this clears is a wait: a frame message arrives once per
        // display frame whatever else it carries, and a frame that owed no step
        // sends one for exactly this reason.
        watchdog.answered (message.frame);

        // And whether this tick published a PICTURE, which is `present`'s own
        // two skips read off the message it already sends: a tick that stepped
        // and did not claim `game_report_still`. It is the other half of what
        // the render watchdog needs - a renderer owes a draw for exactly the
        // frames the simulation published one for, and for a resting game, a
        // still frame or a halted page that is none of them.
        if (message.stepped && ! message.held) {
            renderWatch.published (message.frame);
        }

        // And what the run would be recorded as, one frame longer. The entries
        // are the ones the simulation's logs grew by, so this is a push of
        // nothing on almost every frame.
        growRecord (runRecord, message.frame, message.records);

        // And what the newest description folds to, for a recording asked for
        // after this frame to end on.
        runHash = message.hash || null;

        // And what the queue a sender is admitted against shrank by: every
        // message a step was handed is logged, so the log's growth is the
        // count of deliveries.
        undelivered = Math.max (0,
            undelivered - message.records.message.length);

        // And the probe's other two halves, off the same message.
        //
        // The pointer records say which FRAME the simulation applied a position
        // at, which is the far end of the hand-to-eye measurement `track` above
        // starts; and every frame message's arrival is logged so that a gap
        // between two says the simulation or its queue paused. The page's own
        // animation frames are watched inside `probe.js`, so a pointer that was
        // late with neither gap beside it waited in the input queue and nothing
        // on this page stalled at all - which is how a halt that is the
        // PROCESS's rather than a thread's is told from one that is not.
        if (probing && typeof probePointerRecords === "function") {
            probePointerRecords (performance.now (), message.records.pointer);
        }

        if (probing && typeof probeFrame === "function") {
            probeFrame (performance.now (), message.frame, message.stepped);
        }

        // And what it would keep, as of the newest frame the game asked to be
        // saved on. Held rather than written, because `watchStore` decides when
        // a host saves and this is not one of its moments; and a frame carrying
        // none leaves the last one standing, which is what makes this a mailbox
        // rather than a log.
        if (message.save && ! resuming) { keptSave = message.save; }

        // The frame a pause costs has been published, so the sound may now stop.
        // `setHalt` held it back for exactly this: the sound is put away after
        // the last frame it is owed rather than before it.
        //
        // OWED rather than heard, and that was already the case before the
        // worklet rendered: the queue on the far side is up to three ticks deep,
        // so what a put-away cuts off is whatever of them had not reached the
        // speaker. What changed is only which side the arithmetic happens on.
        if (message.pointerAway && quietWhenPublished) {
            quietWhenPublished = false;

            // The state is read again rather than trusted, exactly as
            // `AUDIO_GRACE`'s timer reads it: a player who paused and resumed
            // faster than a message round trip is a page that has already been
            // told to start the sound, and stopping it here would silence a run
            // that is playing.
            //
            // `silenced` and not `halted`, which is the narrower of the two and
            // is what makes this path KEEP the grace rather than cut it short.
            // A game that went to rest inside that round trip is a game nobody
            // stopped listening to; `halted` here would put its sound away on
            // the instant, which is the one thing the five seconds above exist
            // to prevent, and this is the one path left that could do it.
            if (synth && silenced (halt)) { replaceSpeaker (); }
        }

        // The game says nothing more is coming until something happens to it,
        // and nothing has - `Clock.advance` on the far side holds the two things
        // that can already have happened by the time this is read. What is left
        // here is the flag, which is the page's because everything it stops is.
        if (message.idle) { setHalt ({ idle: true }); }

        break;
    }

    // A resumed run handed over to the hand, said to whoever framed this page
    // only where the run did not arrive at the picture its recording named.
    case "resumed":
        forwarding = false;

        if (message.diverged) {
            console.warn (`player: the run resumed at frame ${message.frame} `
                + `is not the run its recording was taken from`);

            tellParent ({ kind: "arcade-resume-diverged",
                frame: message.frame });
        }

        break;

    // A recording to start from that says less than a run needs, refused
    // before anything was built. The page goes on waiting for another.
    case "unresumed":
        console.warn (`player: resume refused: ${message.reason}`);

        tellParent ({ kind: "arcade-resume-refused", reason: message.reason });

        break;

    // A task became ready under a game whose state had no other reason to move.
    case "wake":
        wake ();

        break;

    // Textures this page uploaded ahead of their answer that never became
    // live - the game finalized the task first, or the commit would have
    // passed a figure - and which no list will ever name.
    case "untextured":
        if (presenter) {
            for (const id of message.ids) { presenter.discard (id); }
        }

        break;

    // Where the scrub bar's cursor landed, which is NOT a frame: no step ran,
    // so there is nothing to grow the record by and nothing for the watchdog
    // to have been waiting on, and neither is touched.
    case "scrubbed":
        scrubLanded (message);

        break;

    // The recording the probe was playing has run out, which is what ends a
    // capture: the frames after it are the game sitting on whatever input the
    // file left held, and a reading taken over them would be measuring a still
    // screen. The run itself plays on.
    case "replayed":
        if (probing && typeof probeFinish === "function") {
            probeFinish (`recording ended at frame ${message.frame}`);
        }

        break;

    // And a line from the simulation for the person watching, which this page
    // shows rather than prints: a probe is taken with the browser's own console
    // closed, because an open inspector is itself a load on the thread the
    // reading is about.
    case "note":
        if (probing && typeof probeNote === "function") {
            probeNote (message.text);
        }

        break;
    }
}

// The one place the game's declared colour becomes the page's. `theme` is in
// `player.js` and does the whole derivation; what is left here is the browser's
// half of it - writing custom properties, which is the page's own vocabulary,
// and `color-scheme`, which is what makes the browser's scrollbars and its
// focus rings follow a game that chose a pale surround.
//
// Custom properties on `documentElement` rather than a stylesheet swap, so the
// fallback block at the top of this file stays the one writer of what these
// mean and this is only new values for them. It is also what a refusal falls
// back to: `refuse` throws before a session exists, so the page keeps its own
// dark chrome and says so in `--alarm` rather than on whatever the game wanted.

function applyTheme () {
    const colours = theme (declaration.background);
    const root = document.documentElement;

    for (const [name, value] of Object.entries (colours)) {
        if (name === "light") { continue; }

        root.style.setProperty (`--${name}`, value);
    }

    root.style.colorScheme = colours.light ? "light" : "dark";
}

// What the page does with the identity it read out of the module, which is now
// almost nothing: a title, the colours and the keycap legends.
//
// The legends are the one of the three that is advice rather than appearance,
// and they are here because they are read out of the module exactly as the
// other two are - `Game_Controls` arrives through the same hand-mirrored
// `LAYOUT` block as the name and the background do.
//
// This used to restate the whole of it on screen - name, version, state size,
// controls, what it had loaded, what it drew - and the argument for
// that was that every one of those values arrives through the hand-mirrored
// `LAYOUT` block, so a mirror that had drifted from `interface/game.h` showed
// up as a wrong name or an impossible state size in front of a reader, rather
// than as a game quietly misbehaving.
//
// That reader is now `web_player_plays_<game>`, which compares all five against
// what `inspector info` reads out of the native plug-in through the console - a
// wholly separate path, checked on every run rather than whenever somebody
// happens to look. The row was the only reader when it was written and is not
// the only reader now, which is what made it affordable to delete.

function describe () {
    // What is left of the identity the page read out of the module, now that
    // the row that showed the rest is gone: the tab still carries the name and
    // the version, which is the one place a person can tell two games apart
    // without playing them.
    document.title =
        `${declaration.name} ${declaration.version.join (".")}`;

    applyTheme ();

    fillLegends (legendRow, declaration.controls, document);
}

// The canvas keeps the browser's pointer over every game, paused or not, and
// nothing here touches `canvas.style.cursor`. The pointer is the page's
// furniture, as the scrub bar is, rather than part of the picture, and a game
// draws no cursor of its own (`products/web-player/DECISIONS.md`).
//
// It was hidden until 2026-10-17 over a game declaring a pointer, while not
// paused, so that the game could draw its own: a pointer the browser draws is
// on the glass rather than in the list, so no golden hashes it and
// `inspector shot` does not show it. A game that declared a pointer and drew
// no cursor - Stuffit, by design - left a mouse pointing at nothing visible,
// and the owner overruled the argument.

    // a timer of its own because this is the one callback that knows the page
    // is awake: `madhousearcade`'s `docs/runs/threaded-host-run.md` (b) says a
    // watchdog on a timer, reading a clock in a tab that stopped running
    // animation frames, would fire every few seconds.
    const stall = watchdog.overdue (now);

    if (stall) { seize (stallLine (stall), stall.frame + 1); return; }

    // And the other thread, on the same callback and by a different rule. A
    // renderer that has stopped answering while the simulation goes on
    // publishing is replaced the first time and is the run ending the second,
    // which answers the second question of `madhousearcade`'s
    // `docs/archived/render-worker-plan.md` at `3f4fdb8d`: a renderer that
    // hangs twice is a game that hangs, and an unbounded loop would hide it.
    //
    // AFTER the simulation's, because the two are not independent when both are
    // overdue: a page whose simulation has stopped has nothing left to draw and
    // no reason to build a renderer for it, and the line above has already
    // ended the run by the time this one could run.
    const blind = renderWatch.overdue (now);

    if (blind) {
        if (renderWatch.replaced) {
            seize (renderStallLine (blind), blind.frame);

            return;
        }

        replaceRenderer ();
    }

    // AND WHAT EACH THREAD HAS BEEN SILENT SINCE. What arrives through `fromSim`
    // is a heartbeat per tick carrying the record, the save and the halt the
    // game may have asked for, and what arrives through `fromRender` is a list
    // per picture - which is the renderer's heartbeat as well as its
    // work, because a thread that is rendering is a thread that is there. This
    // marks the instant each of them has been silent since, and the next answer
    // of either kind clears its own.
    //
    // AFTER THE COMMIT rather than before it, which is what makes the render
    // watchdog read a commit rather than a delivery: a list that arrived since
    // the last callback has already been drawn and marked by the time this
    // line asks whether one is owed.
    //
    // LAST, and after the tick as well. Nothing is collected here: the tick
    // above is posted and not waited on, so what this arithmetic reads is the
    // interval a heartbeat has been owed for and never a round trip this
    // callback blocked on.
    watchdog.posted (now);
    renderWatch.posted (now);
}

// ---------------------------------------------------------------------------
// Boot, once the module's bytes are in hand.
//
// No overlay: the title screen is the game's own, drawn by its `render` and
// left by its own `a` button, so the console shows it rather than the page.
//
// The page keeps exactly one audio responsibility. An AudioContext created
// without a user gesture starts suspended and stays there - measured, on
// file:// and http:// alike - so the first gesture of any kind resumes it. That
// is usually the same keypress that leaves the title screen, so a player never
// notices there was a rule. Arriving from a menu by clicking a link, a context
// built at load used to be running already, because activation propagates
// across a navigation a gesture initiated - also measured. Every context is
// built suspended now, and `reset`'s resume is what starts that one, once its
// worklet has opened and with no press.
//
// The keypress is NOT consumed: it belongs to the game, which is watching for
// exactly that edge.
// ---------------------------------------------------------------------------

function start ([bytes, host, rules]) {
    wasmBytes = bytes;
    trampoline = host.module;
    trampolineBytes = host.bytes;
    core = rules.module;
    coreBytes = rules.bytes;

    // Before the first session and after the one round trip it needed: what a
    // pair is held to is the rulebook's, so this is the earliest the page can
    // ask. A refusal here still refuses the page once rather than on whichever
    // reset happened to be the first to want it.
    //
    // Out of `runQuery` rather than out of `location.search`, which is the
    // ordering the composer above exists for: the seed this reads is the one
    // the address bar is showing, and the `day` beside it is the one that was
    // composed at load rather than one re-read now - a page that re-read the
    // clock here would play one day and record another the moment a run crossed
    // midnight.
    //
    // The same rulebook is what a message posted to this window is held to, so
    // it is kept rather than spent.
    messageRules = new HostCore (core);

    ({ seed: runSeed, args: runArguments } = queryArguments (runQuery,
        messageRules));

    // The presenter, once for the life of the page and before the first run,
    // whose sheet is uploaded to it. A browser without WebGL2 is refused out
    // loud rather than played blind: there is no other picture this console
    // can draw, and section 7 of `docs/archived/gpu-console-plan.md` is where
    // the software presenter that would draw one is proposed.
    presenter = Presenter.open (canvas);

    if (! presenter) {
        refuse ("this browser offers no WebGL2 context, and WebGL2 is what "
            + "this console draws its picture with.");
    }

    reset ();

    // Said once, at startup, because nothing on screen says where the page went
    // looking. A module moved out of its own directory, or a `resources=` that
    // names a directory nobody built, leaves every load failing, and the game
    // draws its fallbacks with the reason only in here. It prints the resolved
    // directory rather than what was typed, so a relative value and the site
    // prefix it was resolved against are both visible.
    //
    // WHERE rather than WHAT, which is the whole of what this line lost with
    // the manifest: nothing is declared in advance any more, so at startup no
    // host knows what this game will ask for. What each read did is on the
    // console as it happens, and `resourceLine` is the whole log.
    console.info (`player: ${declaration.name} reads what its bodies ask `
        + `for from ` + resourceDirectory.href);

    // The speaker is the one `reset` above built, at load rather than on the
    // gesture. Compiling the module, loading the worklet and constructing the
    // processor all work on a suspended context - measured, the processor runs
    // and answers on the audio thread with no gesture whatsoever - and only
    // `resume()` is gated. Building it then costs nothing and removes an eight
    // frame window, measured, in which the loop was already running and
    // anything the game emitted was dropped for want of a node.
    //
    // Except while the scrub bar is open, where the sound is the bar's to start
    // and stop: an arrow tapped there must stay silent, and a context this
    // resumed on it would run on until the resume.
    const unlock = () => {
        if (! (scrubbing && halt.paused)) { synth.resume (); }
    };

    // Two properties, and the fullscreen key cost a bug for want of each.
    //
    // CAPTURE, so the unlock sees the gesture before any handler that might
    // SPEND it. `requestFullscreen` consumes transient user activation, and the
    // page's own keydown listener is installed at load while this one cannot
    // exist until the module has been fetched - so on a first press of `F` the
    // fullscreen request ran first, took the activation, and `resume()` was
    // refused the one thing it needs. A capture listener on `window` runs
    // before a bubbling one on `window` for an event targeting anything below
    // it, which a keydown always is.
    //
    // And PERSISTENT rather than `{ once: true }`, which is the deeper of the
    // two. A one-shot spends itself whether or not the resume took, so a single
    // refused attempt left the keyboard with no unlock at all and only the
    // still-armed pointerdown could recover it - press `F`, play, and the game
    // was silent until the canvas happened to be clicked. `resume` already
    // no-ops on a running context, so leaving these installed costs a state
    // check per gesture and makes the unlock retry until it takes. That is
    // robust to any FUTURE handler that spends activation, which the capture
    // flag alone would not be.
    //
    // `start` runs once, at `fetchModule (…).then (start)`, so these are
    // registered once and nothing accumulates them.

    addEventListener ("keydown", unlock, { capture: true });
    addEventListener ("pointerdown", unlock, { capture: true });

    // The identity line is longer than the placeholder, so the HUD may have
    // grown a row and the canvas has to be measured against what is there now.
    fitCanvas ();

    // The frame `construct` left behind, drawn without waiting for a step. The
    // simulation has held a state since it answered `opened` and its own frame
    // callback may be a display frame away, so this is what puts the game's
    // title screen up rather than an empty canvas - and it is a message, so a
    // worker still compiling simply has not reached it yet.
    redraw ();

    // A page opened into a background tab is already hidden, and
    // `visibilitychange` fires on a change rather than on the state - so
    // without this the one case that never gets the event is the one that was
    // never in front to begin with. It needs no counterpart: the event does
    // fire when such a tab is first looked at.
    if (document.hidden) { setHalt ({ hidden: true }); }
}

// And the probe's own file, fetched only where the address asked for it.
//
// A script element appended here rather than a `<script src>` in the markup, so
// that an ordinary load neither fetches it nor parses it - and it is a CLASSIC
// script rather than a module for the reason the workers beside it are one, with
// a second reason of its own: two classic scripts share one global lexical
// environment, so appending it after this one has run puts every binding above
// - `probing`, `canvas`, `renderWatch` - in scope for it, and the six hooks in
// this file reach the functions it declares. A module would be its own scope
// and would need a seam between the two that nothing else here has.
//
// Appended rather than awaited: nothing on the page waits for it, the button it
// draws is the gesture that starts a capture, and the hooks above ask whether
// its functions are there yet rather than assuming.

if (probing) {
    const script = document.createElement ("script");

    script.src = new URL ("probe.js", location.href).href;

    document.body.appendChild (script);
}

// And the scrub bar's, by the same argument: fetched only under its key, a
// classic script for the shared globals, and appended rather than awaited -
// the keys above work without it, and the bar it draws is asked after rather
// than assumed.
if (scrubbing) {
    const script = document.createElement ("script");

    script.src = new URL ("scrub.js", location.href).href;

    document.body.appendChild (script);
}

// All three fetches are `player.js`'s, because a round trip for any of these
// modules is not the browser's doing: each refuses by name on every path that
// does not end in the module it wanted, and this hands what they return to the
// boot above.
//
// Together rather than in sequence, because none of them waits on another and a
// page holding two of the three can do nothing with what it has: a game imports
// nothing, so without this player's own six functions there is no record to
// hand a `step`, and without the rulebook there is no table to spawn into, no
// id to ask about and nothing to hold a run's arguments to.

Promise.all ([
    fetchModule (moduleBase),
    fetchTrampoline (new URL ("trampoline.wasm", location.href)),
    fetchCore (new URL ("host-core.wasm", location.href)),

    // And the recording the probe plays instead of the mouse, fetched here
    // beside the module so that the first `reset` has it in hand. Null for
    // every page that is not probing, which `Promise.all` takes as a resolved
    // value - so the array `start` is handed is one shape either way and its
    // three names still land on the three modules.
    replayUrl
        ? fetch (new URL (replayUrl, location.href))
            .then ((answer) => answer.text ())
            .then ((text) => { replayText = text; })
        : null,

    // And the recording a resumed run starts from, which nobody fetches: the
    // page says it is ready and the parent hands it over.
    resuming
        ? new Promise ((resolve) => {
            resumeArrived = resolve;

            tellParent ({ kind: "arcade-resume-ready" });
        })
        : null,
]).then (start);
</script>
</body>
</html>
